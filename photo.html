<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f0f2f5">
<title>Galerie photos</title>
<style>
  :root{
    --bg:#f0f2f5; --card:#fff; --text:#1c1e21; --muted:#65676b;
    --accent:#1877f2; --ok:#1f9d55; --warn:#f7b928; --danger:#d93025;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --safe-left:env(safe-area-inset-left,0px);
    --safe-right:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:calc(10px + var(--safe-top)) calc(10px + var(--safe-right))
            calc(72px + var(--safe-bottom)) calc(10px + var(--safe-left));
    min-height:100vh;min-height:100dvh;
    overscroll-behavior-y:contain;
  }
  header{
    position:sticky;top:0;z-index:20;
    background:rgba(240,242,245,.94);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    margin:calc(-10px - var(--safe-top)) calc(-10px - var(--safe-right)) 10px calc(-10px - var(--safe-left));
    padding:calc(10px + var(--safe-top)) calc(10px + var(--safe-right)) 10px calc(10px + var(--safe-left));
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    border-bottom:1px solid rgba(0,0,0,.06);
  }
  h1{font-size:16px;font-weight:700;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #status{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:1;min-width:0}
  #status .ok{color:var(--ok)} #status .warn{color:var(--warn)} #status .err{color:var(--danger)}

  #gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;min-height:120px}
  @media(min-width:480px){#gallery{grid-template-columns:repeat(3,1fr);gap:10px}}
  @media(min-width:700px){#gallery{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}}

  .card{
    background:var(--card);border-radius:8px;overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,.08);
    display:flex;flex-direction:column;
    animation:fadeIn .2s ease;will-change:opacity,transform;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .card.removing{opacity:0;transform:scale(.85);transition:opacity .2s,transform .2s}
  .card a{
    display:block;text-decoration:none;background:#e4e6eb;
    cursor:zoom-in;position:relative;aspect-ratio:1/1;overflow:hidden;
  }
  .card a::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,#e4e6eb 25%,#eef0f2 50%,#e4e6eb 75%);
    background-size:200% 100%;animation:shimmer 1.4s infinite;
  }
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .card img{
    width:100%;height:100%;object-fit:cover;display:block;
    opacity:0;transition:opacity .25s;position:relative;z-index:1;
  }
  .card img.loaded{opacity:1}
  .card a:has(img.loaded)::before{display:none}
  .card .num{
    padding:4px 6px;font-size:11px;color:var(--muted);
    text-align:center;font-weight:600;background:#fafbfc;
  }

  /* État vide (page ignorée / tout vide) */
  .empty{grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--muted);font-size:14px}
  .empty .icon{font-size:42px;margin-bottom:10px;opacity:.5}
  .empty strong{color:var(--text);display:block;margin-bottom:8px;font-size:16px}
  .empty p{max-width:420px;margin:6px auto 0;line-height:1.5;font-size:13px}
  .empty button{
    margin-top:16px;padding:12px 24px;border:none;background:var(--accent);
    color:#fff;border-radius:10px;font-size:15px;font-weight:600;
    cursor:pointer;touch-action:manipulation;
  }

  /* Pagination sticky en bas */
  #pagination{
    position:fixed;bottom:0;left:0;right:0;z-index:30;
    padding:8px calc(8px + var(--safe-right)) calc(8px + var(--safe-bottom)) calc(8px + var(--safe-left));
    background:rgba(255,255,255,.97);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-top:1px solid rgba(0,0,0,.08);
    display:flex;align-items:center;justify-content:center;gap:4px;
    overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  #pagination::-webkit-scrollbar{display:none}
  .pg-btn{
    flex:0 0 auto;min-width:40px;height:40px;padding:0 8px;
    border:1px solid #ccd0d5;background:#fff;color:var(--text);
    border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;
    transition:background .15s,transform .1s,opacity .2s;
    display:inline-flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;
  }
  .pg-btn:active:not(:disabled):not(.active){background:#e7f3ff;transform:scale(.95)}
  .pg-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;cursor:default}
  .pg-btn:disabled{opacity:.35}
  .pg-btn.nav{font-size:18px;min-width:44px}
  .pg-btn.ellipsis{border:none;background:transparent;cursor:default;min-width:16px;padding:0 2px;opacity:.6}
  .pg-btn.empty{
    opacity:.3;background:#f5f6f7;
    text-decoration:line-through;text-decoration-color:rgba(0,0,0,.3);
  }

  /* Lightbox */
  #lb{
    position:fixed;inset:0;background:#000;z-index:100;
    display:none;align-items:center;justify-content:center;
    touch-action:none;user-select:none;-webkit-user-select:none;
  }
  #lb.on{display:flex}
  #lb img{
    max-width:100%;max-height:100%;object-fit:contain;
    pointer-events:none;transition:opacity .15s;
  }
  #lb img.loading{opacity:.4}
  #lb .close{
    position:absolute;top:calc(12px + var(--safe-top));right:calc(12px + var(--safe-right));
    width:44px;height:44px;border-radius:50%;border:none;
    background:rgba(255,255,255,.15);color:#fff;font-size:26px;
    line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
    z-index:2;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    touch-action:manipulation;
  }
  #lb .counter{
    position:absolute;top:calc(20px + var(--safe-top));left:50%;transform:translateX(-50%);
    color:rgba(255,255,255,.85);font-size:13px;font-weight:600;
    background:rgba(0,0,0,.5);padding:6px 12px;border-radius:20px;
    pointer-events:none;white-space:nowrap;
  }
  #lb .hint{
    position:absolute;bottom:calc(16px + var(--safe-bottom));left:50%;transform:translateX(-50%);
    color:rgba(255,255,255,.7);font-size:12px;
    background:rgba(0,0,0,.5);padding:6px 14px;border-radius:20px;
    pointer-events:none;white-space:nowrap;
  }
  @media(hover:hover){#lb .hint{display:none}}

  @media(max-width:480px){
    h1{font-size:15px} #status{font-size:11px}
    .card .num{font-size:10px;padding:3px 4px}
  }
</style>
</head>
<body>

<header>
  <h1>📷 Photos</h1>
  <div id="status">…</div>
</header>

<div id="gallery"></div>
<div id="pagination"></div>

<div id="lb">
  <img alt="">
  <div class="counter"></div>
  <button class="close" aria-label="Fermer">×</button>
  <div class="hint">← glissez · touchez le bord →</div>
</div>

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const OWNER='marocnetmail', REPO='125', BRANCH='main';
const JSON_URL   = `https://marocnetmail.github.io/${REPO}/json/data_img.json`;
const RAW_BASE   = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;
const PAGES_BASE = `https://marocnetmail.github.io/${REPO}/`;
const PER_PAGE   = 30;

/* =========================================================
   RÉFÉRENCES
   ========================================================= */
const $ = id => document.getElementById(id);
const galleryEl=$('gallery'), statusEl=$('status'), paginationEl=$('pagination');
const lbEl=$('lb'), lbImg=lbEl.querySelector('img');
const lbCounter=lbEl.querySelector('.counter'), lbClose=lbEl.querySelector('.close');

/* =========================================================
   ÉTAT GLOBAL
   ========================================================= */
let photos=[];
let currentPage=1, totalPages=1;
let pageToken=0;
let navigationDirection=1;
let skipDepth=0;

const knownGood=new Map();     // globalIdx → URL validée
const knownBad =new Set();     // globalIdx → introuvable partout
const emptyPages=new Set();    // pages dont toutes les entrées sont introuvables
let preferredPattern=null;     // motif appris (raw_01, raw_exact, …)

let pageValid=[];              // photos valides de la page courante (pour la lightbox)
let lbPos=-1;

/* =========================================================
   DÉCOMPOSITION D'UNE URL
   ========================================================= */
function parseUrl(rawUrl){
  const clean=String(rawUrl).trim().replace(/^\/+/,'');
  const parts=clean.split('/');
  const filename=parts.pop()||'';
  const dir=parts.length?parts.join('/')+'/':'';
  const dot=filename.lastIndexOf('.');
  const base=dot>=0?filename.slice(0,dot):filename;
  const ext =dot>=0?filename.slice(dot):'.jpg';
  return {dir,base,ext,hasSuffix:/_\d{1,2}$/.test(base)};
}

/* =========================================================
   MOTIFS D'URL (ordre = priorité)
   ========================================================= */
const PATTERNS=[
  {id:'raw_01',    make:p=>RAW_BASE  +p.dir+p.base+'_01'+p.ext,  needSuffix:false},
  {id:'raw_exact', make:p=>RAW_BASE  +p.dir+p.base    +p.ext,    needSuffix:true },
  {id:'raw_1',     make:p=>RAW_BASE  +p.dir+p.base+'_1'+p.ext,   needSuffix:false},
  {id:'pg_01',     make:p=>PAGES_BASE+p.dir+p.base+'_01'+p.ext,  needSuffix:false},
  {id:'pg_exact',  make:p=>PAGES_BASE+p.dir+p.base    +p.ext,    needSuffix:true },
];

function urlsFor(rawUrl){
  const p=parseUrl(rawUrl);
  const list=[], seen=new Set();
  const push=pat=>{
    if(!pat.needSuffix && p.hasSuffix) return;
    const u=pat.make(p);
    if(!seen.has(u)){seen.add(u); list.push({id:pat.id,url:u});}
  };
  if(preferredPattern){
    const pref=PATTERNS.find(x=>x.id===preferredPattern);
    if(pref) push(pref);
  }
  PATTERNS.forEach(push);
  return list;
}

/* =========================================================
   INITIALISATION
   ========================================================= */
async function init(){
  try{
    statusEl.textContent='Chargement…';
    const res=await fetch(JSON_URL,{cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    let data=await res.json();
    if(!Array.isArray(data)) data=data.images||data.data||data.photos||data.items||[];
    if(!Array.isArray(data)||!data.length) throw new Error('JSON vide');

    photos=data
      .filter(p=>p&&(p.url||p.src||p.image||p.path))
      .map(p=>{
        const u=p.url||p.src||p.image||p.path;
        const n=p.numero??p.num??p.id??p.n??0;
        return {numero:Number(n)||0,url:String(u)};
      })
      .sort((a,b)=>a.numero-b.numero);

    if(!photos.length) throw new Error('Aucune URL');

    totalPages=Math.ceil(photos.length/PER_PAGE);
    statusEl.innerHTML=`<span class="ok">${photos.length} photos</span> · ${totalPages} pages`;
    gotoPage(1);
  }catch(err){
    statusEl.innerHTML='<span class="err">Erreur : '+err.message+'</span>';
    console.error(err);
  }
}

/* =========================================================
   VÉRIFICATION D'UNE IMAGE (avec cache)
   ========================================================= */
async function resolveImageForIdx(p,gIdx){
  if(knownGood.has(gIdx)) return knownGood.get(gIdx);
  if(knownBad.has(gIdx))  return null;

  const variants=urlsFor(p.url);
  for(const v of variants){
    const ok=await new Promise(resolve=>{
      const img=new Image();
      img.onload =()=>resolve(true);
      img.onerror=()=>resolve(false);
      img.src=v.url;
    });
    if(ok){
      knownGood.set(gIdx,v.url);
      if(!preferredPattern && v.id) preferredPattern=v.id;
      return v.url;
    }
  }
  knownBad.add(gIdx);
  return null;
}

/* Test rapide : la page a-t-elle du contenu ?
   Échantillon de 5 images réparties → réponse en ~200ms/page */
async function testPageHasContent(page){
  const start=(page-1)*PER_PAGE;
  const end  =Math.min(start+PER_PAGE,photos.length);
  const slice=photos.slice(start,end);
  if(!slice.length) return false;

  const idxs=[...new Set([
    0,
    Math.floor(slice.length/4),
    Math.floor(slice.length/2),
    Math.floor(3*slice.length/4),
    slice.length-1
  ])];

  const results=await Promise.all(
    idxs.map(i=>resolveImageForIdx(slice[i],start+i))
  );
  return results.some(Boolean);
}

/* =========================================================
   RECHERCHE DE LA PROCHAINE PAGE NON VIDE
   ========================================================= */
async function findNextNonEmptyPage(){
  const MAX_SKIP=50;
  let tested=0;

  for(let d=1; d<=totalPages && tested<MAX_SKIP; d++){
    const fwd=currentPage + d*navigationDirection;
    if(fwd>=1 && fwd<=totalPages && !emptyPages.has(fwd)){
      tested++;
      if(await testPageHasContent(fwd)) return fwd;
      emptyPages.add(fwd);
    }
    const bwd=currentPage - d*navigationDirection;
    if(bwd>=1 && bwd<=totalPages && !emptyPages.has(bwd)){
      tested++;
      if(await testPageHasContent(bwd)) return bwd;
      emptyPages.add(bwd);
    }
  }
  return null;
}

/* =========================================================
   CHANGEMENT DE PAGE
   ========================================================= */
function gotoPage(page, opts={}){
  const prevPage=currentPage;
  currentPage=Math.max(1,Math.min(totalPages,page));

  if(!opts.isAutoSkip){
    if(currentPage>prevPage) navigationDirection=1;
    else if(currentPage<prevPage) navigationDirection=-1;
    skipDepth=0;
  }

  const token=++pageToken;
  const start=(currentPage-1)*PER_PAGE;
  const end  =Math.min(start+PER_PAGE,photos.length);
  const slice=photos.slice(start,end);

  const counters={total:slice.length,resolved:0,loaded:0,failed:0};
  pageValid=[];

  galleryEl.innerHTML='';

  slice.forEach((p,i)=>{
    const gIdx=start+i;

    if(knownBad.has(gIdx)){
      counters.failed++;
      counters.resolved++;
      return;
    }

    if(knownGood.has(gIdx)){
      const url=knownGood.get(gIdx);
      galleryEl.appendChild(makeStaticCard(p,url,gIdx));
      pageValid.push({numero:p.numero,url,globalIdx:gIdx});
      counters.loaded++;
      counters.resolved++;
      return;
    }

    galleryEl.appendChild(makeDynamicCard(p,gIdx,counters,token));
  });

  if(!opts.isAutoSkip){
    renderPagination();
    updateStatus(counters);
  }

  // Toutes les entrées étaient déjà connues (succès ou échec)
  if(counters.resolved===counters.total){
    handlePageComplete(token,counters);
  }
}

/* =========================================================
   CARTE DYNAMIQUE
   ========================================================= */
function makeDynamicCard(p,gIdx,counters,token){
  const card=document.createElement('div');
  card.className='card';

  const link=document.createElement('a');
  link.href='#';
  link.addEventListener('click',e=>{
    e.preventDefault();
    const pos=pageValid.findIndex(v=>v.globalIdx===gIdx);
    if(pos>=0) openLightbox(pos);
  });

  const img=document.createElement('img');
  img.loading='lazy';
  img.decoding='async';
  img.alt='Photo n° '+p.numero;

  const variants=urlsFor(p.url);
  let idx=0, resolved=false;

  const finish=()=>{
    if(token!==pageToken) return;
    if(counters.resolved===counters.total) handlePageComplete(token,counters);
  };

  const tryNext=()=>{
    if(resolved) return;
    if(idx>=variants.length){
      resolved=true;
      knownBad.add(gIdx);
      card.classList.add('removing');
      setTimeout(()=>{card.remove();},250);
      counters.failed++;
      counters.resolved++;
      finish();
      return;
    }
    const v=variants[idx++];
    img.dataset.pattern=v.id;
    img.src=v.url;
  };

  img.addEventListener('load',()=>{
    if(resolved) return;
    resolved=true;
    const usedPattern=img.dataset.pattern;
    if(!preferredPattern && usedPattern) preferredPattern=usedPattern;
    knownGood.set(gIdx,img.currentSrc||img.src);
    pageValid.push({numero:p.numero,url:knownGood.get(gIdx),globalIdx:gIdx});
    pageValid.sort((a,b)=>a.globalIdx-b.globalIdx);
    img.classList.add('loaded');
    counters.loaded++;
    counters.resolved++;
    finish();
  });

  img.addEventListener('error',tryNext);

  link.appendChild(img);
  card.appendChild(link);
  const num=document.createElement('div');
  num.className='num'; num.textContent='N° '+p.numero;
  card.appendChild(num);

  tryNext();
  return card;
}

/* =========================================================
   CARTE STATIQUE (URL déjà validée)
   ========================================================= */
function makeStaticCard(p,url,gIdx){
  const card=document.createElement('div');
  card.className='card';

  const link=document.createElement('a');
  link.href='#';
  link.addEventListener('click',e=>{
    e.preventDefault();
    const pos=pageValid.findIndex(v=>v.globalIdx===gIdx);
    if(pos>=0) openLightbox(pos);
  });

  const img=document.createElement('img');
  img.loading='lazy';
  img.decoding='async';
  img.alt='Photo n° '+p.numero;
  img.src=url;
  img.classList.add('loaded');

  link.appendChild(img);
  card.appendChild(link);
  const num=document.createElement('div');
  num.className='num'; num.textContent='N° '+p.numero;
  card.appendChild(num);
  return card;
}

/* =========================================================
   PAGE COMPLÈTE → détection page vide → auto-skip
   ========================================================= */
async function handlePageComplete(token,counters){
  if(token!==pageToken) return;

  // La page a du contenu → on s'arrête
  if(counters.loaded>0){
    skipDepth=0;
    renderPagination();
    updateStatus(counters);
    return;
  }

  // Page vide
  emptyPages.add(currentPage);

  // Affiche l'état vide et le message de recherche
  galleryEl.innerHTML=
    '<div class="empty">'+
      '<div class="icon">🔎</div>'+
      '<strong>Page vide</strong>'+
      '<p>Recherche d\'une page contenant des images…</p>'+
    '</div>';
  statusEl.innerHTML=`<span class="warn">Page ${currentPage} vide · recherche…</span>`;

  const target=await findNextNonEmptyPage();

  if(token!==pageToken) return;   // l'utilisateur a navigué entre-temps

  if(target===null){
    showAllEmpty();
    return;
  }

  const delay = skipDepth===0 ? 350 : 60;
  skipDepth++;

  gotoPage(target,{isAutoSkip:true});
  setTimeout(()=>{ if(token===pageToken){} },delay);   // delay inutile ici mais garde la structure
}

/* =========================================================
   ÉTAT : AUCUNE IMAGE NULLE PART
   ========================================================= */
function showAllEmpty(){
  galleryEl.innerHTML=
    '<div class="empty">'+
      '<div class="icon">📭</div>'+
      '<strong>Aucune image disponible</strong>'+
      '<p>Toutes les entrées du JSON ont été testées, aucun fichier correspondant '+
      'n\'existe dans le dépôt.</p>'+
    '</div>';
  paginationEl.innerHTML='';
  statusEl.innerHTML='<span class="err">0 image</span>';
}

/* =========================================================
   STATUT
   ========================================================= */
function updateStatus(c){
  statusEl.innerHTML=
    `<span class="ok">P.${currentPage}/${totalPages}</span> · `+
    `${c.loaded}/${c.total}`+
    (c.failed?` · ${c.failed} ignorée(s)`:'');
}

/* =========================================================
   LIGHTBOX
   ========================================================= */
function openLightbox(pos){
  if(pos<0||pos>=pageValid.length) return;
  lbPos=pos;
  showLightboxPhoto();
  lbEl.classList.add('on');
  document.body.style.overflow='hidden';
}
function closeLightbox(){
  lbEl.classList.remove('on');
  lbPos=-1;
  document.body.style.overflow='';
}
function showLightboxPhoto(){
  const p=pageValid[lbPos];
  if(!p) return;
  lbImg.classList.add('loading');
  lbImg.onload=()=>lbImg.classList.remove('loading');
  lbImg.src=p.url;
  lbImg.alt='Photo n° '+p.numero;
  lbCounter.textContent=(lbPos+1)+' / '+pageValid.length+'  ·  N° '+p.numero;
}
function lbNext(){ if(lbPos<pageValid.length-1){lbPos++;showLightboxPhoto();} }
function lbPrev(){ if(lbPos>0){lbPos--;showLightboxPhoto();} }

lbEl.addEventListener('click',e=>{
  if(e.target===lbClose){closeLightbox();return;}
  const rect=lbEl.getBoundingClientRect();
  const ratio=(e.clientX-rect.left)/rect.width;
  if(ratio<0.33) lbPrev();
  else if(ratio>0.67) lbNext();
  else closeLightbox();
});

let tStart=null;
lbEl.addEventListener('touchstart',e=>{
  if(e.touches.length!==1) return;
  tStart={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now()};
},{passive:true});

lbEl.addEventListener('touchend',e=>{
  if(!tStart) return;
  const dx=e.changedTouches[0].clientX-tStart.x;
  const dy=e.changedTouches[0].clientY-tStart.y;
  const dt=Date.now()-tStart.t;
  const start=tStart; tStart=null;

  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5 && dt<600){
    dx<0?lbNext():lbPrev(); return;
  }
  if(Math.abs(dx)<10 && Math.abs(dy)<10 && dt<250){
    const rect=lbEl.getBoundingClientRect();
    const ratio=(start.x-rect.left)/rect.width;
    if(ratio<0.33) lbPrev();
    else if(ratio>0.67) lbNext();
    else closeLightbox();
  }
},{passive:true});

document.addEventListener('keydown',e=>{
  if(!lbEl.classList.contains('on')) return;
  if(e.key==='Escape') closeLightbox();
  else if(e.key==='ArrowRight') lbNext();
  else if(e.key==='ArrowLeft') lbPrev();
});

/* =========================================================
   PAGINATION
   ========================================================= */
function renderPagination(){
  paginationEl.innerHTML='';

  const mk=(label,page,opts={})=>{
    const b=document.createElement('button');
    b.className='pg-btn'
      +(opts.active?' active':'')
      +(opts.nav?' nav':'')
      +(opts.ellipsis?' ellipsis':'')
      +(opts.empty?' empty':'');
    b.textContent=label;
    if(opts.disabled) b.disabled=true;
    if(opts.empty) b.title='Page vide (aucune image)';
    if(!opts.active && !opts.disabled && !opts.ellipsis && !opts.empty){
      b.onclick=()=>gotoPage(page);
    }
    return b;
  };

  paginationEl.appendChild(mk('‹',currentPage-1,{nav:true,disabled:currentPage===1}));

  pageNumbers(currentPage,totalPages).forEach(n=>{
    if(n==='…'){
      paginationEl.appendChild(mk('…',0,{ellipsis:true}));
    } else {
      paginationEl.appendChild(mk(String(n),n,{
        active: n===currentPage,
        empty : emptyPages.has(n) && n!==currentPage
      }));
    }
  });

  paginationEl.appendChild(mk('›',currentPage+1,{nav:true,disabled:currentPage===totalPages}));

  if(totalPages>7){
    const jump=document.createElement('input');
    jump.type='number';
    jump.min=1; jump.max=totalPages; jump.placeholder='page';
    jump.style.cssText='width:70px;height:40px;padding:0 8px;border:1px solid #ccd0d5;border-radius:8px;font-size:14px;margin-left:6px;text-align:center';
    jump.addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        const v=parseInt(jump.value,10);
        if(v>=1 && v<=totalPages) gotoPage(v);
      }
    });
    paginationEl.appendChild(jump);
  }
}

function pageNumbers(cur,total){
  const out=[];
  const add=n=>{if(!out.includes(n))out.push(n)};
  add(1);
  for(let i=cur-2;i<=cur+2;i++) if(i>1&&i<total) add(i);
  if(total>1) add(total);
  const withEll=[];
  for(let i=0;i<out.length;i++){
    withEll.push(out[i]);
    if(i<out.length-1 && out[i+1]-out[i]>1) withEll.push('…');
  }
  return withEll;
}

/* =========================================================

   ========================================================= */
init();
</script>
