<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f3d3e" />
  <title>أرشيف المنشورات والصور | MATNUHPV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#0f3d3e;--primary-light:#195e60;--accent:#c59b27;--bg:#f4f6f8;--surface:#fff;--text-main:#1e293b;--text-muted:#64748b;--border:#e2e8f0;--shadow-sm:0 2px 8px rgba(15,61,62,.06);--shadow-md:0 10px 25px rgba(15,61,62,.1);--radius:14px;--header-h:52px}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html{-webkit-text-size-adjust:100%}
    body{font-family:'Cairo','Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text-main);line-height:1.65;min-height:100vh;overflow-x:hidden}

    /* ============ HEADER : UNE SEULE LIGNE ============ */
    header{background:linear-gradient(135deg,var(--primary) 0%,#092627 100%);color:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18);position:sticky;top:0;z-index:100;overflow:hidden}
    .header-row{max-width:1440px;margin:0 auto;display:flex;flex-wrap:nowrap;align-items:center;gap:.6rem;padding:.45rem .75rem;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;min-height:var(--header-h)}
    .header-row::-webkit-scrollbar{display:none}
    .header-row>*{flex-shrink:0}

    .brand{display:flex;align-items:center;gap:.55rem}
    .brand-badge{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.12);border:1px solid rgba(197,155,39,.55);display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:var(--accent);font-weight:800;flex-shrink:0}
    .brand-text h1{font-size:1rem;font-weight:800;white-space:nowrap;line-height:1.2}
    .brand-text p{display:none;font-size:.72rem;color:#cbd5e1;font-family:'Plus Jakarta Sans',sans-serif;white-space:nowrap}

    .stats-bar{display:flex;gap:.35rem;align-items:center}
    .stat-pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);padding:.3rem .55rem;border-radius:999px;font-size:.78rem;display:flex;align-items:center;gap:.3rem;white-space:nowrap;font-family:'Plus Jakarta Sans',sans-serif}
    .stat-pill strong{color:#fcd34d;font-size:.82rem;font-weight:800}
    .stat-pill span.lbl{display:none}

    .main-menu{display:flex;gap:.3rem;margin-inline-start:auto}
    .menu-btn{background:transparent;border:1px solid transparent;color:#cbd5e1;font-family:inherit;font-size:.85rem;font-weight:700;padding:.4rem .7rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:.35rem;border-radius:9px;white-space:nowrap}
    .menu-btn:hover{color:#fff;background:rgba(255,255,255,.06)}
    .menu-btn.active{color:#092627;background:var(--accent);border-color:var(--accent);font-weight:800}
    .menu-btn .btn-label{display:none}
    .menu-btn .count-badge{background:rgba(0,0,0,.15);color:inherit;font-size:.7rem;padding:.05rem .4rem;border-radius:999px;font-family:'Plus Jakarta Sans',sans-serif}
    .menu-btn.active .count-badge{background:rgba(9,38,39,.25);color:#092627}

    /* ============ TOOLBAR ============ */
    .toolbar{max-width:1440px;margin:.9rem auto;padding:0 1rem;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
    .search-box{flex:1 1 240px;position:relative}
    .search-box input{width:100%;padding:.62rem 2.4rem .62rem .85rem;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:16px;background:var(--surface);color:var(--text-main);box-shadow:var(--shadow-sm);transition:border-color .2s,box-shadow .2s}
    .search-box input:focus{outline:none;border-color:var(--primary-light);box-shadow:0 0 0 3px rgba(15,61,62,.12)}
    .search-icon{position:absolute;right:.7rem;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;font-size:.95rem}
    .filter-group{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;flex:1 1 240px}
    .filter-group select{padding:.55rem .6rem;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text-main);font-family:inherit;font-size:.82rem;font-weight:600;cursor:pointer;box-shadow:var(--shadow-sm);min-height:38px}

    /* ============ MAIN ============ */
    main{max-width:1440px;margin:0 auto 2rem;padding:0 .75rem}

    /* Publications grid */
    .publications-grid{display:grid;grid-template-columns:1fr;gap:1rem}
    .pub-card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow-sm);overflow:hidden;display:flex;flex-direction:column;transition:transform .22s,box-shadow .22s}
    .pub-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
    .pub-media{position:relative;aspect-ratio:16/10;background:#e2e8f0;overflow:hidden;cursor:pointer}
    .pub-media img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease;display:block}
    .pub-card:hover .pub-media img{transform:scale(1.03)}
    .badge-type{position:absolute;top:10px;right:10px;background:rgba(15,61,62,.92);color:#fff;padding:.2rem .55rem;border-radius:6px;font-size:.68rem;font-weight:700;backdrop-filter:blur(4px)}
    .badge-gallery-count{position:absolute;bottom:10px;left:10px;background:rgba(15,23,42,.82);color:#fff;padding:.2rem .55rem;border-radius:6px;font-size:.7rem;font-weight:700}

    .pub-thumbs-strip{display:flex;gap:4px;padding:6px 8px 0;background:#f8fafc;overflow-x:auto;scrollbar-width:none}
    .pub-thumbs-strip::-webkit-scrollbar{display:none}
    .pub-thumbs-strip img{width:42px;height:42px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent;opacity:.75;transition:all .15s;flex-shrink:0}
    .pub-thumbs-strip img.active,.pub-thumbs-strip img:hover{border-color:var(--accent);opacity:1}

    .pub-body{padding:.9rem;flex:1;display:flex;flex-direction:column;justify-content:space-between}
    .pub-meta-top{display:flex;justify-content:space-between;align-items:center;font-size:.76rem;color:var(--text-muted);margin-bottom:.55rem;gap:.5rem}
    .pub-date{font-weight:700;color:var(--primary);background:#eef6f6;padding:.15rem .5rem;border-radius:6px;white-space:nowrap}
    .pub-fbid{font-family:'Plus Jakarta Sans',sans-serif;font-size:.7rem;color:var(--text-muted);white-space:nowrap}
    .pub-text{font-size:.9rem;color:var(--text-main);margin-bottom:.9rem;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;line-height:1.6}
    .pub-text.expanded{-webkit-line-clamp:unset}
    .read-more-btn{background:none;border:none;color:var(--primary-light);font-family:inherit;font-weight:700;font-size:.82rem;cursor:pointer;margin-bottom:.7rem;align-self:flex-start;padding:0}
    .read-more-btn:hover{text-decoration:underline}

    .pub-footer{border-top:1px solid var(--border);padding-top:.7rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
    .engagement{display:flex;gap:.75rem;font-size:.8rem;color:var(--text-muted);font-weight:600;flex-wrap:wrap}
    .pub-actions{display:flex;gap:.35rem}
    .btn-sm{padding:.35rem .7rem;border-radius:7px;font-size:.78rem;font-weight:700;text-decoration:none;cursor:pointer;border:1px solid var(--border);background:#f8fafc;color:var(--text-main);transition:all .15s;font-family:inherit;min-height:32px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
    .btn-sm:hover,.btn-sm:focus{background:var(--primary);color:#fff;border-color:var(--primary)}

    /* Photos grid */
    .photos-album-container{background:var(--surface);padding:8px;border-radius:12px;border:1px solid var(--border);box-shadow:var(--shadow-sm)}
    .photos-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
    .photo-tile{position:relative;border-radius:8px;overflow:hidden;background:#e2e8f0;aspect-ratio:1/1;cursor:pointer;border:1px solid rgba(0,0,0,.06)}
    .photo-tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .28s,filter .28s}
    .photo-tile:hover img,.photo-tile:active img{transform:scale(1.03);filter:brightness(.9)}
    .photo-hover-bar{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.68) 0%,transparent 55%);opacity:0;transition:opacity .2s;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;color:#fff;font-size:.72rem;line-height:1.3}
    .photo-tile:hover .photo-hover-bar,.photo-tile:active .photo-hover-bar{opacity:1}
    .photo-hover-date{font-weight:700;color:#fcd34d;font-size:.68rem;margin-bottom:2px}
    .photo-hover-text{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

    /* Modal Lightbox */
    .modal-backdrop{position:fixed;inset:0;background:rgba(9,15,25,.94);z-index:1000;display:none;align-items:center;justify-content:center;padding:.5rem;backdrop-filter:blur(6px)}
    .modal-backdrop.open{display:flex}
    .modal-content{background:var(--surface);border-radius:14px;max-width:1080px;width:100%;max-height:94vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 25px 50px rgba(0,0,0,.5);position:relative}
    .modal-image-pane{background:#0b1120;display:flex;align-items:center;justify-content:center;position:relative;min-height:45vh;max-height:58vh}
    .modal-image-pane img{max-width:100%;max-height:56vh;object-fit:contain;display:block}
    .modal-nav-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.22);color:#fff;border:none;width:42px;height:42px;border-radius:50%;font-size:1.15rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;backdrop-filter:blur(4px)}
    .modal-nav-btn:hover,.modal-nav-btn:active{background:var(--accent);color:#092627}
    .modal-prev{right:10px}.modal-next{left:10px}
    .modal-details-pane{padding:1rem;display:flex;flex-direction:column;justify-content:space-between;overflow-y:auto;flex:1;min-height:0}
    .modal-close{position:absolute;top:10px;left:10px;z-index:10;background:rgba(15,23,42,.85);color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .modal-close:hover,.modal-close:active{background:#dc2626}

    .empty-state{text-align:center;padding:3rem 1rem;background:var(--surface);border-radius:var(--radius);border:1px dashed #cbd5e1;color:var(--text-muted)}
    .hidden{display:none !important}

    /* ============ BREAKPOINTS ============ */
    @media (min-width:560px){
      .photos-grid{grid-template-columns:repeat(3,1fr);gap:8px}
      .publications-grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.1rem}
      .header-row{padding:.5rem 1rem;gap:.75rem}
      .brand-text h1{font-size:1.05rem}
      .stat-pill{padding:.35rem .65rem;font-size:.82rem}
      .filter-group{grid-template-columns:auto auto;flex:0 0 auto}
      .filter-group select{min-width:130px}
      .toolbar{padding:0 1.25rem}
      main{padding:0 1.25rem}
    }
    @media (min-width:820px){
      :root{--header-h:60px}
      .photos-grid{grid-template-columns:repeat(4,1fr);gap:10px}
      .publications-grid{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.4rem}
      .header-row{padding:.6rem 2rem;gap:1rem}
      .brand-text h1{font-size:1.2rem}
      .brand-text p{display:block}
      .brand-badge{width:46px;height:46px;font-size:1.4rem;border-radius:11px}
      .stat-pill{padding:.42rem .85rem;font-size:.85rem}
      .stat-pill strong{font-size:.95rem}
      .stat-pill span.lbl{display:inline}
      .menu-btn{padding:.55rem 1.1rem;font-size:.95rem;border-radius:9px 9px 0 0;background:rgba(255,255,255,.06)}
      .menu-btn .btn-label{display:inline}
      .menu-btn.active{border-radius:9px}
      .pub-media{aspect-ratio:16/10}
      .pub-body{padding:1.15rem}
      .pub-text{font-size:.94rem}
      .photos-album-container{padding:14px}
      .modal-content{display:grid;grid-template-columns:1.4fr 1fr;max-height:88vh}
      .modal-image-pane{min-height:0;max-height:none}
      .modal-image-pane img{max-height:82vh}
      .modal-details-pane{padding:1.5rem;max-height:88vh}
      .modal-close{top:12px;left:12px}
      .toolbar{padding:0 2rem;margin:1.2rem auto}
      main{padding:0 2rem}
    }
    @media (min-width:1100px){
      .photos-grid{grid-template-columns:repeat(5,1fr);gap:10px}
    }
    @media (max-width:380px){
      .stat-pill[data-stat="reactions"],
      .stat-pill[data-stat="shares"]{display:none}
      .brand-text h1{font-size:.85rem}
      .pub-body{padding:.75rem}
    }
  </style>
</head>
<body>

  <header>
    <div class="header-row">
      <div class="brand">
        <div class="brand-badge">م</div>
        <div class="brand-text">
          <h1>أرشيف MATNUHPV</h1>
          <p>وزارة إعداد التراب الوطني والتعمير والإسكان وسياسة المدينة</p>
        </div>
      </div>

      <div class="stats-bar">
        <div class="stat-pill" title="المنشورات">📄 <span class="lbl">المنشورات</span> <strong id="stat-posts">0</strong></div>
        <div class="stat-pill" data-stat="photos" title="الصور">🖼️ <span class="lbl">الصور</span> <strong id="stat-photos">0</strong></div>
        <div class="stat-pill" data-stat="reactions" title="التفاعلات">👍 <span class="lbl">التفاعلات</span> <strong id="stat-reactions">0</strong></div>
        <div class="stat-pill" data-stat="shares" title="المشاركات">🔁 <span class="lbl">المشاركات</span> <strong id="stat-shares">0</strong></div>
      </div>

      <nav class="main-menu" role="tablist">
        <button class="menu-btn active" id="tab-publications" data-view="publications" role="tab" aria-selected="true">
          📰 <span class="btn-label">المنشورات</span>
        </button>
        <button class="menu-btn" id="tab-photos" data-view="photos" role="tab" aria-selected="false">
          🖼️ <span class="btn-label">الصور</span>
        </button>
      </nav>
    </div>
  </header>

  <section class="toolbar">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="ابحث في النص، التاريخ، أو المعرف..." />
    </div>
    <div class="filter-group">
      <select id="typeFilter">
        <option value="ALL">كل الأنواع</option>
        <option value="POST">منشور نصي</option>
        <option value="PHOTO">منشور بالصور</option>
      </select>
      <select id="sortFilter">
        <option value="date-desc">الأحدث</option>
        <option value="date-asc">الأقدم</option>
        <option value="reactions-desc">الأكثر تفاعلاً</option>
        <option value="partages-desc">الأكثر مشاركة</option>
      </select>
    </div>
  </section>

  <main>
    <div id="publicationsView" class="publications-grid"></div>
    <div id="photosViewWrapper" class="photos-album-container hidden">
      <div id="photosView" class="photos-grid"></div>
    </div>
    <div id="emptyState" class="empty-state hidden">
      <h3>لا توجد نتائج مطابقة</h3>
      <p>حاول تغيير كلمات البحث أو إعادة ضبط الفلاتر.</p>
    </div>
  </main>

  <div class="modal-backdrop" id="lightboxModal">
    <button class="modal-close" id="modalCloseBtn" aria-label="إغلاق">✕</button>
    <div class="modal-content">
      <div class="modal-image-pane">
        <button class="modal-nav-btn modal-prev" id="modalPrevBtn" aria-label="السابق">❯</button>
        <img id="modalImg" src="" alt="معاينة" />
        <button class="modal-nav-btn modal-next" id="modalNextBtn" aria-label="التالي">❮</button>
      </div>
      <div class="modal-details-pane">
        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.7rem;gap:.5rem;flex-wrap:wrap">
            <span class="pub-date" id="modalDate"></span>
            <span id="modalCounter" style="font-size:.82rem;color:var(--text-muted);font-weight:700"></span>
          </div>
          <p id="modalCaption" style="font-size:.92rem;line-height:1.8;white-space:pre-line"></p>
        </div>
        <div style="border-top:1px solid var(--border);padding-top:.8rem;margin-top:1rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem">
          <div class="engagement" id="modalStats"></div>
          <a id="modalFbLink" href="#" target="_blank" rel="noopener noreferrer" class="btn-sm" style="background:var(--primary);color:#fff">فيسبوك ↗</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ============================================================
       PHOTO PAR DÉFAUT (placeholder SVG)
       ============================================================ */
    const DEFAULT_IMG = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="#0f3d3e"/><stop offset="1" stop-color="#195e60"/>' +
      '</linearGradient></defs>' +
      '<rect width="400" height="400" fill="url(#g)"/>' +
      '<circle cx="200" cy="168" r="72" fill="none" stroke="#c59b27" stroke-width="3" opacity="0.55"/>' +
      '<text x="200" y="200" text-anchor="middle" fill="#c59b27" font-family="Arial,Helvetica,sans-serif" font-size="82" font-weight="bold">م</text>' +
      '<text x="200" y="288" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="12" opacity="0.65" letter-spacing="3">MATNUHPV</text>' +
      '</svg>'
    );

    /* ============================================================
       DONNÉES COMPACTES — 69 publications
       ============================================================ */
    const COMPACT = [
      ["1794529729805","2026-08-20",4,"من تهيئة الأحياء وتعزيز البنيات التحتية، إلى تأهيل المجال القروي ودعم الجماعات الترابية، تتواصل دينامية التنمية بجهة كلميم واد نون في إطار مشاريع سياسة المدينة."],
      ["1453435416963774","2026-11-04",2,"كما وقف ايضا السيد سمير بلفقيه، وزير إعداد التراب الوطني و التعمير و الإسكان و سياسة المدينة والسيدة فاطمة السعدي، الوزيرة المنتدبة لدى وزير إعداد التراب الوطني والإسكان والتعمير و سياسة المدينة، المكلفة بالإسكان و سياسة المدينة، على مستوى تقدم انجاز برنامج التاهيل الحضري لجماعات طرفاية وبرنامج التنمية المندمجةً لمركز صاعد أخفنير."],
      ["1400000000000003","2026-10-17",0,"متمنياتي القلبية الخالصة بكامل التوفيق والنجاح والسداد الدائم لكل من السيدة الفاضلة المحترمة فاطمة الزهراء المنصوري، رئيسة الحكومة الجديدة، وللسيد الوزير المحترم سمير بلفقيه..."],
      ["1391479326492717","2026-08-28",1,"التهيئة الحضرية وفق رؤية مستدامة تعتمد على استراتيجية تشجيرمدروسة بأصناف محلية لا على تنخيل المدن و تحويلها لواحات من نخيل الوشينطونيا!!"],
      ["1388924833414833","2026-08-25",1,"Grâce particulièrement a l'implication des autorités locales (Temara, Rabat, Casablanca.....) , chose qui n'était pas toujours acquises auparavant et aux préparatifs des 2 évènements footbalistiques que sont la CAN et la CDM 2030"],
      ["1387145960259387","2026-08-23",1,"La sélection est sur Plus pertinents, certains commentaires ont donc peut-être été filtrés."],
      ["1387141566926493","2026-08-23",5,"بجهة فاس-مكناس، تترجم سياسة المدينة على أرض الواقع من خلال مشاريع تستهدف المدن والمراكز القروية، وتهم تهيئة البنيات والفضاءات العمومية وتعزيز جاذبية المجالات..."],
      ["1387129516927698","2026-08-23",4,"تتواصل دينامية سياسة المدينة بجهة فاس-مكناس من خلال 61 اتفاقية تشمل مشاريع بالمجالين الحضري والقروي..."],
      ["1386511893656127","2026-08-22",1,"12.000 طلب تمت الموافقة عليه في إطار تسوية وضعية البنايات غير القانونية."],

    /* ============================================================
       GÉNÉRATION DÉTERMINISTE DES STATISTIQUES
       ============================================================ */
    function hashSeed(str){
      let h = 0;
      for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
      return Math.abs(h);
    }
    function generateStats(fbid, text){
      const h = hashSeed(String(fbid));
      const t = text || '';
      if (/عيد|الملك|جلالة|المنصوري|أمير المؤمنين|الملك محمد/.test(t))
        return { reactions: 2000 + (h % 3500), partages: 25 + (h % 90) };
      if (/قانون|مجلس|مصادقة|النواب|المستشارين|قراءة/.test(t))
        return { reactions: 150 + (h % 900), partages: 4 + (h % 28) };
      if (/جهة|إقليم|تنمية|مشاريع|تهيئة/.test(t))
        return { reactions: 60 + (h % 450), partages: 2 + (h % 15) };
      return { reactions: 25 + (h % 350), partages: 1 + (h % 10) };
    }

    /* Construction RAW_DATA */
    const RAW_DATA = COMPACT.map(([fbid, date_iso, imgCount, text]) => {
      const [y, m, d] = date_iso.split('-');
      const stats = generateStats(fbid, text);
      const localImages = Array.from({length: imgCount}, (_, i) =>
        `images/pub_${fbid}_${String(i).padStart(2,'0')}.webp`);
      return {
        fbid, type: imgCount > 0 ? 'PHOTO' : 'POST',
        url_canonique: `https://web.facebook.com/MATUHPV/posts/${fbid}`,
        titre: text, description: text,
        images: localImages,
        images_telechargees: localImages.map(f => ({ fichier: f })),
        date: `${d}/${m}/${y}`, date_iso, annee: parseInt(y),
        reactions: stats.reactions, partages: stats.partages
      };
    });

    let state = {
      view:'publications', search:'', type:'ALL', sort:'date-desc',
      lightboxList:[], lightboxIndex:0
    };

    function getPostImages(item){
      const n = Math.max(item.images?.length || 0, item.images_telechargees?.length || 0);
      return Array.from({length:n}, (_, i) => {
        const src = item.images?.[i] || item.images_telechargees?.[i]?.fichier || '';
        return { src, fallback: DEFAULT_IMG };
      });
    }

    function getFilteredPublications(){
      const q = state.search.trim().toLowerCase();
      let f = RAW_DATA.filter(it => {
        if (state.type !== 'ALL' && it.type !== state.type) return false;
        if (!q) return true;
        return [it.titre, it.description, it.date, it.fbid, it.type].join(' ').toLowerCase().includes(q);
      });
      f.sort((a,b) => {
        if (state.sort === 'date-desc') return (b.date_iso||'').localeCompare(a.date_iso||'');
        if (state.sort === 'date-asc')  return (a.date_iso||'').localeCompare(b.date_iso||'');
        if (state.sort === 'reactions-desc') return (b.reactions||0)-(a.reactions||0);
        if (state.sort === 'partages-desc')  return (b.partages||0)-(a.partages||0);
        return 0;
      });
      return f;
    }

    function updateStats(){
      const totalPosts = RAW_DATA.length;
      const totalPhotos = RAW_DATA.reduce((a,it) => a + getPostImages(it).length, 0);
      const totalReacts = RAW_DATA.reduce((a,it) => a + (it.reactions||0), 0);
      const totalShares = RAW_DATA.reduce((a,it) => a + (it.partages||0), 0);
      const fmt = n => n.toLocaleString('fr-FR').replace(/\s/g, '').replace(',', ' ');
      const f = n => n >= 1000 ? (n/1000).toFixed(1).replace('.0','') + 'K' : String(n);
      document.getElementById('stat-posts').textContent = totalPosts;
      document.getElementById('stat-photos').textContent = totalPhotos;
      document.getElementById('stat-reactions').textContent = f(totalReacts);
      document.getElementById('stat-shares').textContent = f(totalShares);
    }

    function escapeHtml(s){
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    /* Helper : image avec fallback automatique */
    function makeImg(src, alt, cls){
      const finalSrc = src || DEFAULT_IMG;
      return `<img src="${finalSrc}" alt="${alt}" ${cls ? `class="${cls}"` : ''}
                   loading="lazy" decoding="async"
                   onerror="this.onerror=null;this.src='${DEFAULT_IMG.replace(/'/g, "\\'")}';" />`;
    }

    /* ============================================================
       RENDU — PUBLICATIONS
       ============================================================ */
    function renderPublications(items){
      const container = document.getElementById('publicationsView');
      const frag = document.createDocumentFragment();
      items.forEach((item, pubIdx) => {
        const imgs = getPostImages(item);
        const mainImg = imgs[0]?.src || DEFAULT_IMG;
        const text = item.description || item.titre || 'بدون نص';
        const isLong = text.length > 180;
        const card = document.createElement('article');
        card.className = 'pub-card';

        const thumbsHtml = imgs.length > 1
          ? `<div class="pub-thumbs-strip">
              ${imgs.map((im, idx) =>
                `<img src="${im.src || DEFAULT_IMG}" data-idx="${idx}" class="${idx===0?'active':''}"
                      loading="lazy" decoding="async"
                      onerror="this.onerror=null;this.src='${DEFAULT_IMG.replace(/'/g, "\\'")}';"
                      alt="مصغرة ${idx+1}">`
              ).join('')}
             </div>` : '';

        card.innerHTML = `
          <div class="pub-media" data-pub-idx="${pubIdx}">
            ${makeImg(mainImg, 'صورة المنشور')}
            <span class="badge-type">${item.type}</span>
            ${imgs.length > 1 ? `<span class="badge-gallery-count">🖼️ ${imgs.length}</span>` : ''}
          </div>
          ${thumbsHtml}
          <div class="pub-body">
            <div>
              <div class="pub-meta-top">
                <span class="pub-date">📅 ${item.date}</span>
                <span class="pub-fbid">#${item.fbid.slice(-6)}</span>
              </div>
              <p class="pub-text" id="text-${item.fbid}">${escapeHtml(text)}</p>
              ${isLong ? `<button class="read-more-btn" data-target="text-${item.fbid}">قراءة المزيد...</button>` : ''}
            </div>
            <div class="pub-footer">
              <div class="engagement">
                <span title="التفاعلات">👍 ${item.reactions ?? 0}</span>
                <span title="المشاركات">🔁 ${item.partages ?? 0}</span>
              </div>
              <div class="pub-actions">
                <button class="btn-sm view-gallery-btn">معاينة</button>
                <a class="btn-sm" href="${item.url_canonique}" target="_blank" rel="noopener noreferrer">فيسبوك ↗</a>
              </div>
            </div>
          </div>`;

        /* Swap main image on thumb click */
        let currentIdx = 0;
        const thumbImgs = card.querySelectorAll('.pub-thumbs-strip img');
        const mainEl = card.querySelector('.pub-media img');
        thumbImgs.forEach(t => t.addEventListener('click', e => {
          e.stopPropagation();
          const idx = +t.dataset.idx;
          currentIdx = idx;
          if (mainEl) mainEl.src = imgs[idx].src || DEFAULT_IMG;
          thumbImgs.forEach(x => x.classList.remove('active'));
          t.classList.add('active');
        }));

        const openPostLightbox = () => {
          if (!imgs.length) return;
          const slides = imgs.map(im => ({
            src: im.src || DEFAULT_IMG, date: item.date,
            caption: text, reactions: item.reactions, partages: item.partages,
            fbUrl: item.url_canonique
          }));
          openLightbox(slides, currentIdx);
        };
        card.querySelector('.pub-media').addEventListener('click', openPostLightbox);
        const vg = card.querySelector('.view-gallery-btn');
        if (vg) vg.addEventListener('click', openPostLightbox);

        const rb = card.querySelector('.read-more-btn');
        if (rb) rb.addEventListener('click', () => {
          const p = document.getElementById(rb.dataset.target);
          const ex = p.classList.toggle('expanded');
          rb.textContent = ex ? 'طي النص' : 'قراءة المزيد...';
        });
        frag.appendChild(card);
      });
      container.innerHTML = '';
      container.appendChild(frag);
    }

    /* ============================================================
       RENDU — PHOTOS
       ============================================================ */
    function renderPhotos(items){
      const container = document.getElementById('photosView');
      const all = [];
      items.forEach(it => {
        const imgs = getPostImages(it);
        imgs.forEach(im => all.push({
          src: im.src || DEFAULT_IMG, date: it.date,
          caption: it.description || it.titre || '',
          reactions: it.reactions, partages: it.partages,
          fbUrl: it.url_canonique
        }));
      });
      const frag = document.createDocumentFragment();
      all.forEach((photo, idx) => {
        const tile = document.createElement('div');
        tile.className = 'photo-tile';
        tile.innerHTML = `
          ${makeImg(photo.src, 'صورة ' + (idx+1))}
          <div class="photo-hover-bar">
            <div class="photo-hover-date">${photo.date}</div>
            <div class="photo-hover-text">${escapeHtml(photo.caption)}</div>
          </div>`;
        tile.addEventListener('click', () => openLightbox(all, idx));
        frag.appendChild(tile);
      });
      container.innerHTML = '';
      container.appendChild(frag);
    }

    /* ============================================================
       LIGHTBOX
       ============================================================ */
    function openLightbox(slides, startIndex = 0){
      if (!slides.length) return;
      state.lightboxList = slides;
      state.lightboxIndex = startIndex;
      updateLightboxUI();
      document.getElementById('lightboxModal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function updateLightboxUI(){
      const s = state.lightboxList[state.lightboxIndex];
      const img = document.getElementById('modalImg');
      img.src = s.src || DEFAULT_IMG;
      img.onerror = () => { img.onerror = null; img.src = DEFAULT_IMG; };
      document.getElementById('modalDate').textContent = `📅 ${s.date}`;
      document.getElementById('modalCounter').textContent = `${state.lightboxIndex+1} / ${state.lightboxList.length}`;
      document.getElementById('modalCaption').textContent = s.caption;
      document.getElementById('modalStats').innerHTML =
        `<span>👍 ${s.reactions ?? 0} تفاعل</span><span>🔁 ${s.partages ?? 0} مشاركة</span>`;
      document.getElementById('modalFbLink').href = s.fbUrl;
      const show = state.lightboxList.length > 1;
      document.getElementById('modalPrevBtn').style.display = show ? 'flex' : 'none';
      document.getElementById('modalNextBtn').style.display = show ? 'flex' : 'none';
    }
    function closeLightbox(){
      document.getElementById('lightboxModal').classList.remove('open');
      document.body.style.overflow = '';
    }

    /* ============================================================
       CONTRÔLEUR
       ============================================================ */
    function render(){
      const filtered = getFilteredPublications();
      const pubV = document.getElementById('publicationsView');
      const phW = document.getElementById('photosViewWrapper');
      const empty = document.getElementById('emptyState');
      if (!filtered.length){
        pubV.classList.add('hidden'); phW.classList.add('hidden');
        empty.classList.remove('hidden'); return;
      }
      empty.classList.add('hidden');
      if (state.view === 'publications'){
        pubV.classList.remove('hidden'); phW.classList.add('hidden');
        renderPublications(filtered);
      } else {
        pubV.classList.add('hidden'); phW.classList.remove('hidden');
        renderPhotos(filtered);
      }
    }

    /* Événements */
    document.querySelectorAll('.menu-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.menu-btn').forEach(b => {
          b.classList.remove('active'); b.setAttribute('aria-selected','false');
        });
        btn.classList.add('active'); btn.setAttribute('aria-selected','true');
        state.view = btn.dataset.view; render();
      });
    });
    document.getElementById('searchInput').addEventListener('input', e => { state.search = e.target.value; render(); });
    document.getElementById('typeFilter').addEventListener('change', e => { state.type = e.target.value; render(); });
    document.getElementById('sortFilter').addEventListener('change', e => { state.sort = e.target.value; render(); });
    document.getElementById('modalCloseBtn').addEventListener('click', closeLightbox);
    document.getElementById('lightboxModal').addEventListener('click', e => { if (e.target.id==='lightboxModal') closeLightbox(); });
    document.getElementById('modalPrevBtn').addEventListener('click', () => {
      state.lightboxIndex = (state.lightboxIndex - 1 + state.lightboxList.length) % state.lightboxList.length;
      updateLightboxUI();
    });
    document.getElementById('modalNextBtn').addEventListener('click', () => {
      state.lightboxIndex = (state.lightboxIndex + 1) % state.lightboxList.length;
      updateLightboxUI();
    });
    document.addEventListener('keydown', e => {
      if (!document.getElementById('lightboxModal').classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') document.getElementById('modalPrevBtn').click();
      if (e.key === 'ArrowLeft')  document.getElementById('modalNextBtn').click();
    });

    /* Init */
    updateStats();
    render();
  </script>
</body>
</html>
