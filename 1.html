<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Galerie Reels Facebook</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' };</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  html { -webkit-text-size-adjust: 100%; }
  body { -webkit-tap-highlight-color: transparent; }
  .reel-card { position: relative; }
  
  /* Contraintes de date : une seule ligne */
  .date-display {
    display: inline-block;
    white-space: nowrap;
    direction: rtl;
    unicode-bidi: isolate;
    max-width: 100%;
  }

  /* Contraintes de titre */
  .video-title {
    display: block;
    width: 100%;
    white-space: normal;
    word-wrap: break-word;
    overflow-wrap: anywhere;
    line-height: 1.3;
  }

  /* --- Styles pour l'Arborescence --- */
  .tree-list {
    list-style-type: none;
    padding-left: 0;
    margin: 0;
  }
  .tree-list .tree-list {
    padding-left: 1.5rem;
    border-left: 2px dashed #334155;
    margin-left: 0.75rem;
  }
  .tree-item {
    position: relative;
    padding: 0.4rem 0;
  }
  .tree-list .tree-list .tree-item::before {
    content: '';
    position: absolute;
    left: -1.5rem;
    top: 1rem;
    width: 1rem;
    border-top: 2px dashed #334155;
  }
  .tree-toggle {
    cursor: pointer;
    transition: transform 0.2s;
  }
  .tree-toggle.open {
    transform: rotate(90deg);
  }
  .tree-children.hidden {
    display: none;
  }

  #detailsContent::-webkit-scrollbar { width: 6px; }
  #detailsContent::-webkit-scrollbar-track { background: transparent; }
  #detailsContent::-webkit-scrollbar-thumb { background: rgba(100,116,139,.4); border-radius: 3px; }
  @supports (padding: max(0px)) {
    .safe-bottom { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
  }
  
  /* Tooltip CSS personnalisé pour le thème */
  .theme-tooltip .tooltip-text {
    visibility: hidden;
    width: max-content;
    max-width: 150px;
    background-color: #1e293b;
    color: #fff;
    text-align: center;
    border-radius: 6px;
    padding: 6px 10px;
    position: absolute;
    z-index: 50;
    top: 120%;
    left: 0;
    opacity: 0;
    transition: opacity 0.2s;
    border: 1px solid #334155;
    font-size: 11px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    pointer-events: none;
  }
  .theme-tooltip:hover .tooltip-text {
    visibility: visible;
    opacity: 1;
  }
</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

<!-- ============ HEADER ============ -->
<header class="sticky top-0 z-40 bg-slate-800/95 backdrop-blur border-b border-slate-700 shadow-lg">
  <div class="max-w-[1400px] mx-auto px-3 sm:px-6 lg:px-8 py-2.5 sm:py-4">
    <div class="flex flex-wrap items-center gap-2 sm:gap-3">
      <div class="flex items-center gap-2 flex-shrink-0">
        <div class="p-1.5 sm:p-2 bg-blue-600 rounded-lg shadow">
          <i class="fa-solid fa-video text-white text-sm sm:text-xl"></i>
        </div>
        <h1 class="text-sm sm:text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent whitespace-nowrap">
          Galerie<span class="hidden sm:inline"> Reels</span>
        </h1>
      </div>

      <div class="flex-1 min-w-[180px]">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs pointer-events-none"></i>
          <input type="text" id="searchInput" inputmode="search" placeholder="Rechercher…"
                 class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-8 pr-3 py-1.5 sm:py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500 placeholder-slate-500">
        </div>
      </div>

      <!-- Sélecteur de Mode d'affichage -->
      <div class="flex items-center gap-1.5">
        <i class="fa-solid fa-layer-group text-slate-400 text-xs hidden sm:inline"></i>
        <select id="viewModeSelect" class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs sm:text-sm text-slate-200 focus:outline-none focus:border-blue-500 cursor-pointer">
          <option value="gallery">Galerie</option>
          <option value="themes">Par thèmes</option>
          <option value="tree">Arborescence</option>
        </select>
      </div>

      <div class="flex items-center gap-1.5">
        <i class="fa-solid fa-sort text-slate-400 text-xs hidden sm:inline"></i>
        <select id="sortSelect" class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs sm:text-sm text-slate-200 focus:outline-none focus:border-blue-500 cursor-pointer">
          <option value="recent">Plus récents</option>
          <option value="views">Plus vues</option>
          <option value="reactions">Plus réagies / commentées</option>
        </select>
      </div>

      <label class="cursor-pointer bg-slate-700 hover:bg-slate-600 active:bg-slate-500 border border-slate-600 text-sm font-medium px-2.5 sm:px-4 py-1.5 sm:py-2 rounded-lg transition-colors flex items-center gap-1.5 flex-shrink-0 touch-manipulation">
        <i class="fa-solid fa-file-import text-blue-400"></i>
        <span class="hidden sm:inline">JSON</span>
        <input type="file" id="jsonFileInput" accept=".json" class="hidden">
      </label>

      <div class="hidden lg:block text-xs bg-slate-900/60 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-400 whitespace-nowrap">
        Total : <span id="totalCount" class="font-bold text-white">0</span>
      </div>
    </div>
  </div>
</header>

<!-- ============ MAIN ============ -->
<main class="max-w-[1400px] mx-auto px-2 sm:px-4 lg:px-8 py-4 sm:py-6 flex-1 w-full relative">
  
  <!-- Bouton Retour (utilisé dans le mode "Par thèmes") -->
  <div id="backNavigation" class="hidden mb-4">
    <button id="backToThemesBtn" class="inline-flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors border border-slate-700">
      <i class="fa-solid fa-arrow-left"></i> Retour aux thèmes
    </button>
  </div>

  <!-- Conteneur pour le mode "Par thèmes" (Grille de thèmes) -->
  <div id="themesView" class="hidden"></div>

  <!-- Conteneur pour le mode "Arborescence" -->
  <div id="treeView" class="hidden bg-slate-800/50 p-4 sm:p-6 rounded-2xl border border-slate-700"></div>

  <!-- Grille des vidéos (Mode Galerie / Vidéos d'un thème) -->
  <div id="reelsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4 w-full"></div>
  
  <div id="emptyState" class="hidden text-center py-16 bg-slate-800/30 rounded-2xl border border-dashed border-slate-700 mt-4">
    <i class="fa-regular fa-folder-open text-5xl text-slate-600 mb-4"></i>
    <h3 class="text-lg font-medium text-slate-300">Aucune vidéo trouvée</h3>
  </div>
  <nav id="pagination" class="flex flex-wrap items-center justify-center gap-1.5 sm:gap-2 mt-6 safe-bottom" aria-label="Pagination"></nav>
</main>

<!-- ============ MODAL DÉTAILS & LECTEUR VIDEO ============ -->
<div id="detailsModal" class="fixed inset-0 z-50 hidden">
  <div class="absolute inset-0 bg-black/90 backdrop-blur-sm" data-close-details></div>
  <div class="relative z-10 w-full h-full flex items-center justify-center p-2 sm:p-4">
    <div class="relative w-full max-w-5xl h-[92vh] bg-slate-800 overflow-hidden shadow-2xl border border-slate-700 rounded-2xl flex flex-col lg:flex-row">
      
      <!-- Bouton Fermer -->
      <button type="button" data-close-details
              class="absolute top-3 right-3 z-50 w-10 h-10 rounded-full bg-slate-900/80 hover:bg-red-600 border border-slate-700 text-white flex items-center justify-center transition-colors shadow-lg touch-manipulation"
              aria-label="Fermer">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <!-- Zone Lecteur Vidéo -->
      <div class="relative bg-black w-full h-[50vh] lg:h-full lg:w-[450px] flex-shrink-0 flex items-center justify-center overflow-hidden">
        
        <!-- Poster avec bouton Play et infos -->
        <div id="detailsPoster" class="absolute inset-0 z-10 transition-opacity duration-300">
          <img id="detailsPosterImg" src="" alt="" class="absolute inset-0 w-full h-full object-cover" onerror="this.style.display='none';">
          
          <!-- Dégradé sombre pour le texte -->
          <div class="absolute inset-0 bg-gradient-to-t from-black via-black/50 to-transparent pointer-events-none"></div>

          <!-- Loader (caché par défaut) -->
          <div id="videoLoader" class="hidden absolute inset-0 z-30 flex items-center justify-center bg-black/40">
            <div class="w-12 h-12 border-4 border-white/20 border-t-white rounded-full animate-spin"></div>
          </div>
          
          <!-- Contenu en bas (Stats, Play, Titre) -->
          <div class="absolute bottom-0 inset-x-0 p-4 sm:p-6 flex flex-col z-20">
            
            <!-- Statistiques -->
            <div class="flex items-center gap-4 mb-4 text-white text-sm font-bold drop-shadow-md">
              <div class="flex items-center gap-1.5">
                <i class="fa-solid fa-eye text-amber-400"></i>
                <span id="playerViewsVal">0</span>
              </div>
              <div class="flex items-center gap-1.5">
                <i class="fa-solid fa-heart text-rose-400"></i>
                <span id="playerReactionsVal">0</span>
              </div>
            </div>

            <div class="flex items-end justify-between gap-4">
              <!-- Bouton Play -->
              <button id="detailsPlayBtn" type="button" class="w-[70px] h-[70px] sm:w-[85px] sm:h-[85px] rounded-full border-[4px] border-white flex items-center justify-center hover:bg-white/20 transition-all active:scale-95 cursor-pointer flex-shrink-0 backdrop-blur-sm bg-black/10 shadow-lg">
                <i class="fa-solid fa-play text-white text-2xl sm:text-3xl ml-1 drop-shadow-md"></i>
              </button>
              
              <!-- Infos Date + Titre -->
              <div class="text-right flex flex-col items-end flex-1 min-w-0">
                <span id="detailsDisplayDate" class="date-display text-white/90 text-xs sm:text-sm font-medium mb-1.5 drop-shadow-md tracking-wide"></span>
                <h3 id="detailsDisplayTitle" class="video-title text-white text-lg sm:text-xl md:text-2xl font-bold drop-shadow-lg" dir="auto"></h3>
              </div>
            </div>
          </div>
        </div>

        <!-- Iframe Vidéo -->
        <iframe id="detailsFrame" class="w-full h-full aspect-[9/16] border-0 opacity-0 transition-opacity duration-500 absolute inset-0 z-0"
                allowfullscreen allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"
                scrolling="no" frameborder="0"></iframe>
      </div>

      <!-- Informations sur la vidéo (Panneau de droite) -->
      <div id="detailsContent" class="flex-1 overflow-y-auto overscroll-contain p-4 sm:p-6 space-y-5 bg-slate-800 safe-bottom"></div>
    </div>
  </div>
</div>

      if (parts.length !== 3) return dateStr || 'Date invalide';
      const y = parseInt(parts[0], 10);
      const m = parseInt(parts[1], 10) - 1;
      const d = parseInt(parts[2], 10);

      const date = new Date(y, m, d);
      if (isNaN(date.getTime())) return dateStr || 'Date invalide';

      const daysAr = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
      const monthsAr = ['يناير', 'فبراير', 'مارس', 'أبريل', 'ماي', 'يونيو', 'يوليوز', 'غشت', 'شتنبر', 'أكتوبر', 'نونبر', 'دجنبر'];

      const dayName = daysAr[date.getDay()];
      const dayNum = String(date.getDate()).padStart(2, '0');
      const monthName = monthsAr[date.getMonth()];
      const year = date.getFullYear();

      return `${dayName} ${dayNum} ${monthName} ${year}`;
    } catch (e) {
      return dateStr || 'Date invalide';
    }
  }

  // ============ RENDU CARTE GALERIE (avec stats) ============
  const galleryCardHTML = (r) => {
    const rawTitle = r.titre || 'Titre indisponible';
    const truncatedTitle = rawTitle.length > 40 ? rawTitle.substring(0, 40) + '...' : rawTitle;
    
    const dateFormatted = formatDateArabicExact(r.date, r.date_iso);
    const views = formatViews(getViews(r));
    const reactions = r.reactions != null ? String(r.reactions) : '0';
    const theme = r.theme_fr || 'Général';
    const themeAr = r.theme_ar || '';

    return `
    <article class="reel-card group relative aspect-[9/16] w-full bg-slate-900 rounded-xl overflow-hidden cursor-pointer shadow-sm hover:shadow-xl transition-all duration-300 active:scale-[0.98] touch-manipulation border border-slate-700/80 hover:border-blue-500/80" data-fbid="${escapeHtml(r.fbid)}">
      <img src="${escapeHtml(r.miniature || PLACEHOLDER)}" alt="Reel" loading="lazy" decoding="async" referrerpolicy="no-referrer"
           class="w-full h-full object-cover brightness-[0.85] group-hover:brightness-100 group-hover:scale-105 transition-all duration-500" onerror="this.onerror=null;this.src='${PLACEHOLDER}';">

      <div class="absolute inset-0 bg-gradient-to-t from-black via-black/80 to-transparent pointer-events-none z-[1]"></div>

      <!-- Badge Thème -->
      <div class="absolute top-2 left-2 z-[3] theme-tooltip">
        <span class="bg-black/60 backdrop-blur-md text-white text-[9px] sm:text-[10px] px-2 py-0.5 rounded-full border border-slate-600 truncate max-w-[100px] inline-block shadow-sm font-semibold">
          ${escapeHtml(theme)}
        </span>
        <div class="tooltip-text" dir="auto"><strong>${escapeHtml(theme)}</strong><br>${themeAr ? escapeHtml(themeAr) : ''}</div>
      </div>

      <div class="absolute bottom-0 inset-x-0 p-2 sm:p-3 flex flex-col z-[2] pt-8">
        <div class="flex items-end justify-between gap-2 w-full mb-1">
          <div class="flex flex-col items-start gap-1.5 flex-shrink-0">
            <div class="flex items-center gap-1 text-[9px] sm:text-[10px] text-white/90 font-bold drop-shadow-md">
              <span class="flex items-center gap-0.5 bg-black/50 px-1.5 py-0.5 rounded backdrop-blur-sm border border-white/10"><i class="fa-solid fa-eye text-amber-400"></i> ${views}</span>
              <span class="flex items-center gap-0.5 bg-black/50 px-1.5 py-0.5 rounded backdrop-blur-sm border border-white/10"><i class="fa-solid fa-heart text-rose-400"></i> ${reactions}</span>
            </div>
            <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-full border-2 border-white flex items-center justify-center bg-black/30 backdrop-blur-sm group-hover:bg-white/20 transition-all">
              <i class="fa-solid fa-play text-white text-[10px] sm:text-xs ml-0.5 drop-shadow-md"></i>
            </div>
          </div>
          <div class="text-right flex-shrink-0 pb-0.5">
            <span class="date-display text-white/80 text-[9px] font-medium drop-shadow-md tracking-wide">${dateFormatted}</span>
          </div>
        </div>
        <div class="w-full">
          <h3 class="video-title text-white text-xs sm:text-sm font-bold drop-shadow-md leading-snug break-words" dir="auto" title="${escapeHtml(rawTitle)}">${escapeHtml(truncatedTitle)}</h3>
        </div>
      </div>
    </article>`;
  };

  // ============ RENDU CARTE THEMES (SANS STATS) ============
  const themeVideoCardHTML = (r) => {
    const rawTitle = r.titre || 'Titre indisponible';
    const truncatedTitle = rawTitle.length > 40 ? rawTitle.substring(0, 40) + '...' : rawTitle;
    const dateFormatted = formatDateArabicExact(r.date, r.date_iso);

    return `
    <article class="reel-card group relative aspect-[9/16] w-full bg-slate-900 rounded-xl overflow-hidden cursor-pointer shadow-sm hover:shadow-xl transition-all duration-300 active:scale-[0.98] touch-manipulation border border-slate-700/80 hover:border-blue-500/80" data-fbid="${escapeHtml(r.fbid)}">
      <img src="${escapeHtml(r.miniature || PLACEHOLDER)}" alt="Reel" loading="lazy" decoding="async" referrerpolicy="no-referrer"
           class="w-full h-full object-cover brightness-[0.85] group-hover:brightness-100 group-hover:scale-105 transition-all duration-500" onerror="this.onerror=null;this.src='${PLACEHOLDER}';">
      <div class="absolute inset-0 bg-gradient-to-t from-black via-black/80 to-transparent pointer-events-none z-[1]"></div>
      
      <div class="absolute bottom-0 inset-x-0 p-2 sm:p-3 flex flex-col z-[2] pt-8">
        <!-- Juste le bouton play et la date -->
        <div class="flex items-end justify-between gap-2 w-full mb-1">
          <div class="flex items-center justify-center w-8 h-8 sm:w-10 sm:h-10 rounded-full border-2 border-white bg-black/30 backdrop-blur-sm group-hover:bg-white/20 transition-all flex-shrink-0">
            <i class="fa-solid fa-play text-white text-[10px] sm:text-xs ml-0.5 drop-shadow-md"></i>
          </div>
          <div class="text-right flex-shrink-0 pb-0.5">
            <span class="date-display text-white/80 text-[9px] font-medium drop-shadow-md tracking-wide">${dateFormatted}</span>
          </div>
        </div>
        <!-- Titre -->
        <div class="w-full">
          <h3 class="video-title text-white text-xs sm:text-sm font-bold drop-shadow-md leading-snug break-words" dir="auto" title="${escapeHtml(rawTitle)}">${escapeHtml(truncatedTitle)}</h3>
        </div>
      </div>
    </article>`;
  };

  // ============ LOGIQUE DE RENDU ============
  function getFilteredAndSorted() {
    const q = currentQuery.toLowerCase().trim();
    let result = reels;
    if (q) {
      result = reels.filter((r) => {
        const hay = [r.titre, r.description, r.theme_fr, r.theme_ar].filter(Boolean).join(' ').toLowerCase();
        return hay.includes(q);
      });
    }
    result = [...result];
    if (currentSort === 'views') result.sort((a, b) => getViews(b) - getViews(a));
    else if (currentSort === 'reactions') result.sort((a, b) => getReactions(b) - getReactions(a));
    else result.sort((a, b) => String(b.date_iso || '').localeCompare(String(a.date_iso || '')));
    return result;
  }

  function render() {
    // Masquer tous les conteneurs
    els.grid.classList.add('hidden');
    els.themesView.classList.add('hidden');
    els.treeView.classList.add('hidden');
    els.pagination.classList.add('hidden');
    els.backNavigation.classList.add('hidden');
    els.empty.classList.add('hidden');

    const items = getFilteredAndSorted();
    els.total.textContent = items.length;

    if (items.length === 0) {
      els.empty.classList.remove('hidden');
      return;
    }

    if (currentViewMode === 'gallery') {
      renderGallery(items);
    } else if (currentViewMode === 'themes') {
      renderThemes(items);
    } else if (currentViewMode === 'tree') {
      renderTree(items);
    }
  }

  // --- Mode Galerie ---
  function renderGallery(items) {
    els.grid.classList.remove('hidden');
    els.pagination.classList.remove('hidden');

    const totalPages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;

    const start = (currentPage - 1) * PAGE_SIZE;
    const pageItems = items.slice(start, start + PAGE_SIZE);

    els.grid.innerHTML = pageItems.map(galleryCardHTML).join('');
    renderPagination(items.length, totalPages);
  }

  // --- Mode Thèmes ---
  function renderThemes(items) {
    if (activeTheme) {
      // Afficher les vidéos du thème sélectionné
      els.backNavigation.classList.remove('hidden');
      els.grid.classList.remove('hidden');
      els.pagination.classList.remove('hidden');
      
      const themeItems = items.filter(r => (r.theme_fr || 'Non classé') === activeTheme);
      
      const totalPages = Math.max(1, Math.ceil(themeItems.length / PAGE_SIZE));
      if (currentPage > totalPages) currentPage = totalPages;
      const start = (currentPage - 1) * PAGE_SIZE;
      const pageItems = themeItems.slice(start, start + PAGE_SIZE);

      els.grid.innerHTML = pageItems.map(themeVideoCardHTML).join('');
      renderPagination(themeItems.length, totalPages);
    } else {
      // Afficher la grille des thèmes
      els.themesView.classList.remove('hidden');
      
      const themesMap = new Map();
      items.forEach(r => {
        const t = r.theme_fr || 'Non classé';
        themesMap.set(t, (themesMap.get(t) || 0) + 1);
      });

      const themeArray = Array.from(themesMap.entries()).sort((a, b) => b[1] - a[1]);

      let html = '<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4 w-full">';
      themeArray.forEach(([themeName, count]) => {
        html += `
          <div class="theme-card bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl p-4 cursor-pointer transition-all duration-300 flex flex-col items-center justify-center text-center gap-2 active:scale-95 shadow-sm" data-theme="${escapeHtml(themeName)}">
            <div class="w-12 h-12 rounded-full bg-blue-500/20 text-blue-400 flex items-center justify-center mb-2">
              <i class="fa-solid fa-folder-open text-xl"></i>
            </div>
            <h3 class="text-white font-bold text-sm sm:text-base leading-tight">${escapeHtml(themeName)}</h3>
            <span class="text-xs text-slate-400 bg-slate-900 px-2 py-0.5 rounded-full mt-1">${count} vidéo${count > 1 ? 's' : ''}</span>
          </div>`;
      });
      html += '</div>';
      els.themesView.innerHTML = html;
    }
  }

  // --- Mode Arborescence ---
  function renderTree(items) {
    els.treeView.classList.remove('hidden');
    
    const themesMap = new Map();
    items.forEach(r => {
      const t = r.theme_fr || 'Non classé';
      if (!themesMap.has(t)) themesMap.set(t, []);
      themesMap.get(t).push(r);
    });

    let html = '<ul class="tree-list">';
    
    themesMap.forEach((videos, themeName) => {
      html += `
        <li class="tree-item">
          <div class="flex items-center gap-2 cursor-pointer select-none hover:bg-slate-700/50 p-1.5 rounded-lg transition-colors tree-toggle-btn">
            <i class="fa-solid fa-chevron-right tree-toggle text-xs text-slate-400"></i>
            <i class="fa-solid fa-folder text-amber-400"></i>
            <span class="font-bold text-slate-200">${escapeHtml(themeName)}</span>
            <span class="text-xs text-slate-500 ml-2 bg-slate-900 px-2 rounded-full">${videos.length}</span>
          </div>
          <ul class="tree-list tree-children hidden mt-1">
            ${videos.map(v => `
              <li class="tree-item">
                <div class="flex items-center gap-2 cursor-pointer hover:bg-slate-700/50 p-1.5 rounded-lg transition-colors text-slate-300" data-fbid="${escapeHtml(v.fbid)}">
                  <i class="fa-solid fa-video text-blue-400 text-xs"></i>
                  <span class="text-sm truncate" title="${escapeHtml(v.titre)}">${escapeHtml(v.titre)}</span>
                  <span class="text-[10px] text-slate-500 ml-auto hidden sm:inline-block">${formatDateArabicExact(v.date, v.date_iso)}</span>
                </div>
              </li>
            `).join('')}
          </ul>
        </li>`;
    });

    html += '</ul>';
    els.treeView.innerHTML = html;
  }

  // ============ PAGINATION ============
  function getPageNumbers(current, total) {
    if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
    if (current <= 4) return [1, 2, 3, 4, 5, '…', total];
    if (current >= total - 3) return [1, '…', total - 4, total - 3, total - 2, total - 1, total];
    return [1, '…', current - 1, current, current + 1, '…', total];
  }

  function renderPagination(totalItems, totalPages) {
    if (totalPages <= 1) { els.pagination.innerHTML = ''; return; }
    const base = 'min-w-[2.5rem] h-10 px-3 rounded-lg font-semibold text-sm transition-colors touch-manipulation inline-flex items-center justify-center';
    const active = 'bg-blue-600 text-white shadow-lg';
    const inactive = 'bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 active:bg-slate-600';
    const disabled = 'bg-slate-800 text-slate-600 border border-slate-700 cursor-not-allowed';

    let html = '';
    html += `<button data-page="${currentPage - 1}" class="${base} ${currentPage === 1 ? disabled : inactive}" ${currentPage === 1 ? 'disabled' : ''}><i class="fa-solid fa-chevron-left text-xs"></i></button>`;
    getPageNumbers(currentPage, totalPages).forEach((p) => {
      if (p === '…') html += `<span class="${base} ${inactive} select-none">…</span>`;
      else html += `<button data-page="${p}" class="${base} ${p === currentPage ? active : inactive}">${p}</button>`;
    });
    html += `<button data-page="${currentPage + 1}" class="${base} ${currentPage === totalPages ? disabled : inactive}" ${currentPage === totalPages ? 'disabled' : ''}><i class="fa-solid fa-chevron-right text-xs"></i></button>`;
    els.pagination.innerHTML = html;
  }

  // ============ GESTION MODALE ============
  function openDetails(reel) {
    currentReel = reel;
    els.detailsContent.innerHTML = renderDetails(reel);
    els.detailsContent.scrollTop = 0;
    els.detailsDisplayTitle.textContent = reel.titre || 'Titre indisponible';
    els.detailsDisplayDate.textContent = formatDateArabicExact(reel.date, reel.date_iso);
    els.playerViewsVal.textContent = formatViews(getViews(reel));
    els.playerReactionsVal.textContent = reel.reactions != null ? String(reel.reactions) : '—';
    els.detailsPosterImg.style.display = '';
    els.detailsPosterImg.src = reel.miniature || PLACEHOLDER;
    els.detailsPoster.classList.remove('opacity-0', 'pointer-events-none');
    els.detailsPoster.classList.add('opacity-100');

    const shareUrl = reel.url_canonique || reel.url;
    const src = `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(shareUrl)}&show_text=false&width=500&height=889&autoplay=false`;
    els.detailsFrame.classList.remove('opacity-100');
    els.detailsFrame.classList.add('opacity-0');
    els.videoLoader.classList.remove('hidden');
    els.detailsModal.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    els.detailsFrame.src = src;
  }

  function closeDetails() {
    els.detailsModal.classList.add('hidden');
    els.detailsFrame.src = 'about:blank';
    els.detailsFrame.classList.remove('opacity-100');
    els.detailsFrame.classList.add('opacity-0');
    els.detailsPoster.classList.add('opacity-0', 'pointer-events-none');
    els.detailsPosterImg.removeAttribute('src');
    els.detailsContent.innerHTML = '';
    document.body.style.overflow = '';
    currentReel = null;
  }

  function playVideo() {
    if (!currentReel) return;
    const shareUrl = currentReel.url_canonique || currentReel.url;
    const src = `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(shareUrl)}&show_text=false&width=500&height=889&autoplay=true`;
    els.detailsPoster.classList.add('opacity-0', 'pointer-events-none');
    els.detailsPoster.classList.remove('opacity-100');
    els.detailsFrame.classList.remove('opacity-0');
    els.detailsFrame.classList.add('opacity-100');
    els.detailsFrame.src = src;
  }

  // --- Rendu détails (modale) ---
  function renderDetails(reel) {
    const views = getViews(reel);
    const reactions = reel.reactions ?? null;
    const themeFr = reel.theme_fr || null;
    const themeAr = reel.theme_ar || null;
    const reelUrl = reel.url || '';
    const description = reel.description || null;

    const statHTML = (label, value, icon, colorClasses) => `
      <div class="bg-slate-900/80 border border-slate-700/80 rounded-xl p-3">
        <div class="flex items-center gap-1.5 text-xs text-slate-400 mb-1">
          <i class="fa-solid ${icon} ${colorClasses.icon}"></i><span>${label}</span>
        </div>
        <div class="text-base font-bold ${colorClasses.text} truncate">${escapeHtml(String(value))}</div>
      </div>`;

    return `
      ${(themeFr || themeAr) ? `<div class="flex flex-wrap gap-2">
        ${themeFr ? `<span class="inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1 rounded-full bg-blue-500/15 text-blue-300 border border-blue-500/30"><i class="fa-solid fa-tag text-[10px]"></i>${escapeHtml(themeFr)}</span>` : ''}
        ${themeAr ? `<span class="inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1 rounded-full bg-indigo-500/15 text-indigo-300 border border-indigo-500/30" dir="rtl">${escapeHtml(themeAr)}</span>` : ''}
      </div>` : ''}
      <h2 class="text-base sm:text-lg font-bold text-white leading-relaxed" dir="auto">${reel.titre ? escapeHtml(reel.titre) : 'Vidéo Reel'}</h2>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
        ${statHTML('Vues', formatViews(views), 'fa-eye', { icon: 'text-amber-400', text: 'text-amber-300' })}
        ${statHTML('Réactions', reactions != null ? String(reactions) : '—', 'fa-heart', { icon: 'text-rose-400', text: 'text-rose-300' })}
        ${statHTML('Date', reel.date || '—', 'fa-calendar', { icon: 'text-slate-400', text: 'text-slate-200' })}
      </div>
      ${description ? `<div class="pt-1"><div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Description</div><p class="text-sm text-slate-300 leading-relaxed whitespace-pre-line bg-slate-900/40 p-3 rounded-lg border border-slate-700/50" dir="auto">${escapeHtml(description)}</p></div>` : ''}
      <div class="flex flex-col sm:flex-row gap-2 pt-3">
        ${reelUrl ? `<a href="${escapeHtml(reelUrl)}" target="_blank" rel="noopener" class="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl transition-colors"><i class="fa-brands fa-facebook"></i> Voir sur Facebook</a>` : ''}
      </div>`;
  }

  // ============ INITIALISATION & ÉVÉNEMENTS ============
  function init(data) {
    reels = Array.isArray(data) ? data : [];
    byId = new Map(reels.map((r) => [String(r.fbid), r]));
    currentPage = 1;
    render();
  }

  function copyText(text, btn) {
    const done = () => {
      const orig = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-check"></i> Copié !';
      setTimeout(() => { btn.innerHTML = orig; }, 1500);
    };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(() => {});
  }

  // Changement de mode
  els.viewModeSelect.addEventListener('change', (e) => {
    currentViewMode = e.target.value;
    activeTheme = null;
    currentPage = 1;
    render();
  });

  // Retour aux thèmes
  els.backToThemesBtn.addEventListener('click', () => {
    activeTheme = null;
    currentPage = 1;
    render();
  });

  // Clic sur la grille (Galerie ou Thèmes)
  els.grid.addEventListener('click', (e) => {
    const card = e.target.closest('[data-fbid]');
    if (!card) return;
    const reel = byId.get(card.dataset.fbid);
    if (reel) openDetails(reel);
  });

  // Clic sur les cartes de Thèmes
  els.themesView.addEventListener('click', (e) => {
    const themeCard = e.target.closest('[data-theme]');
    if (themeCard) {
      activeTheme = themeCard.dataset.theme;
      currentPage = 1;
      render();
    }
  });

  // Clic sur l'Arborescence
  els.treeView.addEventListener('click', (e) => {
    // Toggle dossier
    const toggleBtn = e.target.closest('.tree-toggle-btn');
    if (toggleBtn) {
      const toggleIcon = toggleBtn.querySelector('.tree-toggle');
      const children = toggleBtn.nextElementSibling;
      if (children && children.classList.contains('tree-children')) {
        children.classList.toggle('hidden');
        toggleIcon.classList.toggle('open');
      }
      return;
    }
    // Ouvrir vidéo
    const videoNode = e.target.closest('[data-fbid]');
    if (videoNode) {
      const reel = byId.get(videoNode.dataset.fbid);
      if (reel) openDetails(reel);
    }
  });

  // Pagination
  els.pagination.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-page]');
    if (!btn || btn.disabled) return;
    const p = parseInt(btn.dataset.page, 10);
    if (!p || p === currentPage) return;
    currentPage = p;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // Tri & Recherche
  els.sort.addEventListener('change', (e) => {
    currentSort = e.target.value;
    currentPage = 1;
    render();
  });

  els.search.addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    const val = e.target.value;
    searchTimer = setTimeout(() => {
      currentQuery = val;
      currentPage = 1;
      render();
    }, 200);
  });

  // Modale
  els.detailsModal.addEventListener('click', (e) => {
    if (e.target.closest('[data-close-details]')) { closeDetails(); return; }
  });

  const playBtn = document.getElementById('detailsPlayBtn');
  if (playBtn) playBtn.addEventListener('click', playVideo);

  els.detailsFrame.addEventListener('load', () => {
    if (els.detailsModal.classList.contains('hidden')) return;
    els.videoLoader.classList.add('hidden');
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !els.detailsModal.classList.contains('hidden')) closeDetails();
  });

  // Import JSON
  els.fileInput.addEventListener('change', (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const parsed = JSON.parse(evt.target.result);
        if (!Array.isArray(parsed)) throw new Error('Tableau attendu.');
        init(parsed);
        els.fileInput.value = '';
      } catch (err) { alert('Erreur: ' + err.message); }
    };
    reader.readAsText(file);
  });

  // Démarrage
  try {
    const rawData = document.getElementById('reelsData').textContent || '[]';
    const parsedData = JSON.parse(rawData);
    if (Array.isArray(parsedData)) init(parsedData);
  } catch (err) {
    console.error('Erreur de chargement initial:', err);
  }

})();
</script>
</body>
</html>
