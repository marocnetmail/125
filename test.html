<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>الأرشيف المؤسساتي | فيديوهات · صور · منشورات</title>

<!-- Bibliothèques externes -->
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' };</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- CSS du projet -->
<link rel="stylesheet" href="css/style.css">

<base target="_blank">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

<!-- ============ PROGRESS OVERLAY ============ -->
<div id="progressOverlay" class="hidden fixed inset-0 z-[100] bg-slate-900/95 backdrop-blur-md flex items-center justify-center">
  <div class="w-full max-w-md px-6">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-500/20 mb-4">
        <i class="fa-solid fa-images text-3xl text-blue-400 animate-pulse"></i>
      </div>
      <h2 id="progressTitle" class="text-lg font-bold text-white mb-1">جارٍ التحقق من الصور…</h2>
      <p id="progressCount" class="text-xs text-slate-400">جارٍ التحضير…</p>
    </div>
    <div class="h-2 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
      <div id="progressBar" class="h-full bg-gradient-to-r from-blue-500 to-indigo-500 transition-all duration-300 rounded-full" style="width:0%"></div>
    </div>
    <p id="progressPercent" class="text-center text-sm font-semibold text-blue-300 mt-3">0%</p>
  </div>
</div>

<!-- ============ BANNIÈRE ============ -->
<div class="institutional-banner" role="banner">
  <img src="https://marocnetmail.github.io/125/images/logo2.png" alt="الشعار المؤسساتي" loading="eager">
</div>

<!-- ============ HEADER PRINCIPAL ============ -->
<header class="app-header" dir="rtl">
  <div class="header-row">
    <div class="brand">
      <div class="brand-text"></div>
    </div>

    <nav class="center-tabs" role="tablist" aria-label="القائمة الرئيسية">
      <button class="center-tab active" data-tab="videos" role="tab" aria-selected="true">
        <i class="fa-solid fa-film"></i>
        <span class="tab-label">الفيديوهات</span>
        <span class="count-badge" id="tabCountVideos">0</span>
      </button>
      <button class="center-tab" data-tab="photos" role="tab" aria-selected="false">
        <i class="fa-solid fa-images"></i>
        <span class="tab-label">الصور</span>
        <span class="count-badge" id="tabCountPhotos">0</span>
      </button>
      <button class="center-tab" data-tab="publications" role="tab" aria-selected="false">
        <i class="fa-solid fa-newspaper"></i>
        <span class="tab-label">المنشورات</span>
        <span class="count-badge" id="tabCountPublications">0</span>
      </button>
    </nav>

    <div class="menu-dropdown year-inline" data-dropdown="year">
      <button type="button" class="menu-item" id="menuYear" title="تصفية حسب السنة" aria-label="تصفية حسب السنة" aria-haspopup="true" aria-expanded="false">
        <i class="fa-solid fa-calendar"></i>
        <span class="menu-badge" id="yearBadge">٢٠٢٦</span>
        <i class="fa-solid fa-chevron-down text-[10px] opacity-70 dd-chevron"></i>
      </button>
      <div class="menu-dropdown-content hidden" id="yearDropdownContent" role="menu"></div>
    </div>

    <div class="search-wrap">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="globalSearch" inputmode="search" placeholder="البحث في المحتوى…" aria-label="البحث في المحتوى" dir="rtl">
    </div>
  </div>

  <div class="sub-menu-row visible" id="videoSubMenu">
    <div class="sub-menu-inner">
      <button type="button" class="menu-item" id="menuHome" aria-label="الرئيسية">
        <i class="fa-solid fa-house"></i><span>الرئيسية</span>
      </button>

      <div class="menu-dropdown" data-dropdown="gallery">
        <button type="button" class="menu-item" id="menuGalerie" aria-haspopup="true" aria-expanded="false">
          <i class="fa-solid fa-table-cells-large"></i><span>معرض الفيديوهات</span>
          <i class="fa-solid fa-chevron-down text-[10px] mr-auto opacity-70 dd-chevron"></i>
        </button>
        <div class="menu-dropdown-content hidden" id="galleryDropdown" role="menu">
          <button type="button" class="menu-dropdown-item" data-view="gallery" role="menuitem">
            <i class="fa-solid fa-table-cells-large"></i><span>عرض شبكي</span><i class="fa-solid fa-check dd-check"></i>
          </button>
          <button type="button" class="menu-dropdown-item" data-view="themes" role="menuitem">
            <i class="fa-solid fa-folder-open"></i><span>المحاور الموضوعاتية</span><i class="fa-solid fa-check dd-check"></i>
          </button>
          <button type="button" class="menu-dropdown-item" data-view="tree" role="menuitem">
            <i class="fa-solid fa-sitemap"></i><span>التنظيم الهيكلي</span><i class="fa-solid fa-check dd-check"></i>
          </button>
        </div>
      </div>

      <div class="menu-dropdown" data-dropdown="sort">
        <button type="button" class="menu-item" id="menuSort" aria-haspopup="true" aria-expanded="false">
          <i class="fa-solid fa-clock-rotate-left"></i><span>الأحدث</span>
          <i class="fa-solid fa-chevron-down text-[10px] mr-auto opacity-70 dd-chevron"></i>
        </button>
        <div class="menu-dropdown-content hidden" id="sortDropdown" role="menu">
          <button type="button" class="menu-dropdown-item" data-sort="recent" role="menuitem">
            <i class="fa-solid fa-clock"></i><span>الأحدث</span><i class="fa-solid fa-check dd-check"></i>
          </button>
          <button type="button" class="menu-dropdown-item" data-sort="views" role="menuitem">
            <i class="fa-solid fa-eye"></i><span>الأكثر مشاهدة</span><i class="fa-solid fa-check dd-check"></i>
          </button>
          <button type="button" class="menu-dropdown-item" data-sort="reactions" role="menuitem">
            <i class="fa-solid fa-heart"></i><span>الأكثر تفاعلاً وتعليقاً</span><i class="fa-solid fa-check dd-check"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- ============ MAIN CONTENT ============ -->
<main>
  <section id="videosSection">
    <div id="backNavigation" class="hidden mb-3">
      <button id="backToThemesBtn" type="button" class="inline-flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-sm font-medium border border-slate-700 transition-colors" dir="rtl">
        <i class="fa-solid fa-arrow-right"></i> العودة إلى المحاور
      </button>
    </div>
    <div id="themesView" class="hidden"></div>
    <div id="treeView" class="hidden bg-slate-800/50 p-4 sm:p-6 rounded-2xl border border-slate-700">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4 pb-3 border-b border-slate-700" dir="rtl">
        <h2 class="text-slate-200 font-bold text-base sm:text-lg flex items-center gap-2">
          <i class="fa-solid fa-sitemap text-blue-400"></i>
          <span>الشجرة الموضوعية</span>
        </h2>
        <button id="exportExcelBtn" type="button" class="inline-flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold border border-emerald-500 shadow-sm">
          <i class="fa-solid fa-file-excel"></i><span>تصدير Excel</span>
        </button>
      </div>
      <div id="treeContent"></div>
    </div>
    <div id="reelsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4 w-full"></div>
    <div id="emptyState" class="hidden text-center py-16 bg-slate-800/30 rounded-2xl border border-dashed border-slate-700 mt-4">
      <i class="fa-regular fa-folder-open text-5xl text-slate-600 mb-4"></i>
      <h3 class="text-lg font-medium text-slate-300">لا توجد نتائج</h3>
      <p class="text-sm text-slate-500 mt-2">حاول تغيير البحث أو الفلاتر</p>
    </div>
    <nav id="pagination" class="flex flex-wrap items-center justify-center gap-1.5 sm:gap-2 mt-4 sm:mt-6 safe-bottom"></nav>
  </section>

  <section id="photosSection" class="hidden">
    <div class="photos-album-container bg-slate-800/40 rounded-2xl border border-slate-700 p-2 sm:p-3">
      <div id="photosGrid" class="photos-grid"></div>
    </div>
    <nav id="photosPagination" class="flex flex-wrap items-center justify-center gap-1.5 sm:gap-2 mt-4 sm:mt-6 safe-bottom"></nav>
    <div id="photosEmpty" class="hidden text-center py-16 bg-slate-800/30 rounded-2xl border border-dashed border-slate-700 mt-4">
      <i class="fa-regular fa-images text-5xl text-slate-600 mb-4"></i>
      <h3 class="text-lg font-medium text-slate-300">لا توجد صور</h3>
    </div>
  </section>

  <section id="publicationsSection" class="hidden">
    <div id="pubGrid" class="pub-grid"></div>
    <div id="pubEmpty" class="hidden text-center py-16 bg-slate-800/30 rounded-2xl border border-dashed border-slate-700 mt-4">
      <i class="fa-regular fa-newspaper text-5xl text-slate-600 mb-4"></i>
      <h3 class="text-lg font-medium text-slate-300">لا توجد منشورات</h3>
    </div>
  </section>
</main>

<!-- ============ FOOTER ============ -->
<footer class="w-full max-w-[1400px] mx-auto px-3 sm:px-6 lg:px-8 pt-2 pb-6 safe-bottom">
  <div class="flex justify-center">
    <button id="openRemarksBtn" type="button" class="cursor-pointer bg-slate-700 hover:bg-slate-600 border border-slate-600 text-sm font-medium px-5 sm:px-6 py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-md">
      <i class="fa-solid fa-comment-dots text-amber-400"></i><span>الملاحظات</span>
    </button>
  </div>
</footer>

<!-- ============ VIDEO DETAILS MODAL ============ -->
<div id="detailsModal" class="fixed inset-0 z-50 hidden">
  <div class="absolute inset-0 bg-black/90 backdrop-blur-sm" data-close-details></div>
  <div class="relative z-10 w-full h-full flex items-center justify-center p-2 sm:p-4">
    <div class="relative w-full max-w-5xl h-[92vh] bg-slate-800 overflow-hidden shadow-2xl border border-slate-700 rounded-2xl flex flex-col lg:flex-row">
      <button type="button" data-close-details class="absolute top-3 right-3 z-50 w-10 h-10 rounded-full bg-slate-900/80 hover:bg-red-600 border border-slate-700 text-white flex items-center justify-center transition-colors shadow-lg" aria-label="إغلاق">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
      <div id="playerZone" class="relative w-full h-[50vh] lg:h-full lg:w-[450px] flex-shrink-0 flex items-center justify-center overflow-hidden">
        <div id="detailsPoster" class="absolute inset-0 z-10 transition-opacity duration-300">
          <div class="thumb-wrap absolute inset-0">
            <img id="detailsPosterImg" src="" alt="" onerror="this.parentElement.classList.add('thumb-error')" onload="this.parentElement.classList.remove('thumb-error')">
            <div class="thumb-fallback"><i class="fa-regular fa-image"></i><span>الصورة غير متوفرة</span></div>
          </div>
          <div class="absolute inset-0 bg-gradient-to-t from-black via-black/50 to-transparent pointer-events-none"></div>
          <div id="videoLoader" class="hidden pointer-events-none absolute inset-0 z-30 flex items-center justify-center">
            <div class="w-12 h-12 border-4 border-white/40 border-t-white rounded-full animate-spin drop-shadow-lg"></div>
          </div>
          <div class="absolute bottom-0 inset-x-0 p-4 sm:p-6 flex flex-col z-20">
            <div class="flex items-center gap-4 mb-4 text-white text-sm font-bold drop-shadow-md">
              <div class="flex items-center gap-1.5"><i class="fa-solid fa-eye text-amber-400"></i><span id="playerViewsVal">0</span></div>
              <div class="flex items-center gap-1.5"><i class="fa-solid fa-heart text-rose-400"></i><span id="playerReactionsVal">0</span></div>
            </div>
            <div class="flex items-end justify-between gap-4">
              <button id="detailsPlayBtn" type="button" class="w-[70px] h-[70px] sm:w-[85px] sm:h-[85px] rounded-full border-[4px] border-white flex items-center justify-center hover:bg-white/20 transition-all active:scale-95 flex-shrink-0 backdrop-blur-sm bg-black/10 shadow-lg">
                <i class="fa-solid fa-play text-white text-2xl sm:text-3xl ml-1 drop-shadow-md"></i>
              </button>
              <div class="text-right flex flex-col items-end flex-1 min-w-0">
                <span id="detailsDisplayDate" class="date-display text-white/90 text-xs sm:text-sm font-medium mb-1.5 drop-shadow-md tracking-wide"></span>
                <h3 id="detailsDisplayTitle" class="video-title text-white text-lg sm:text-xl md:text-2xl font-bold drop-shadow-lg" dir="auto"></h3>
              </div>
            </div>
          </div>
        </div>
        <iframe id="detailsFrame" class="border-0 opacity-0 transition-opacity duration-500" allowfullscreen allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share; fullscreen" scrolling="no" frameborder="0"></iframe>
        <button id="fullscreenBtn" type="button" class="absolute top-3 left-3 z-40 w-9 h-9 sm:w-10 sm:h-10 rounded-lg bg-black/60 hover:bg-black/80 backdrop-blur-sm border border-white/20 text-white flex items-center justify-center shadow-lg" aria-label="ملء الشاشة">
          <i class="fa-solid fa-expand text-sm"></i>
        </button>
      </div>
      <div id="detailsContent" class="flex-1 overflow-y-auto overscroll-contain p-4 sm:p-6 space-y-5 bg-slate-800 safe-bottom"></div>
    </div>
  </div>
</div>

<!-- ============ LIGHTBOX ============ -->
<div class="lb-backdrop" id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button>
  <div class="lb-content">
    <div class="lb-image-pane">
      <button class="lb-nav lb-prev" id="lbPrev" aria-label="السابق"><i class="fa-solid fa-chevron-right"></i></button>
      <img id="lbImg" src="" alt="">
      <button class="lb-nav lb-next" id="lbNext" aria-label="التالي"><i class="fa-solid fa-chevron-left"></i></button>
    </div>
    <div class="lb-details">
      <div class="lb-meta">
        <span class="lb-date" id="lbDate"></span>
        <span class="lb-counter" id="lbCounter"></span>
      </div>
      <p class="lb-caption" id="lbCaption"></p>
      <div class="lb-footer">
        <div class="pub-stats">
          <span>👍 <strong id="lbReactions">0</strong></span>
          <span>🔁 <strong id="lbShares">0</strong></span>
        </div>
        <a id="lbFbLink" href="#" target="_blank" rel="noopener" class="btn-sm">
          <i class="fa-brands fa-facebook"></i> Facebook
        </a>
      </div>
    </div>
  </div>
</div>

<!-- ============ REMARKS MODAL ============ -->
<div id="remarksModal" class="fixed inset-0 z-50 hidden">
  <div class="absolute inset-0 bg-black/85 backdrop-blur-sm" data-close-remarks></div>
  <div class="relative z-10 w-full h-full flex items-center justify-center p-3 sm:p-4">
    <div class="relative w-full max-w-lg bg-slate-800 rounded-2xl border border-slate-700 shadow-2xl overflow-hidden">
      <div class="flex items-center justify-between p-3 sm:p-4 border-b border-slate-700" dir="rtl">
        <h2 class="text-white font-bold text-base sm:text-lg flex items-center gap-2">
          <i class="fa-solid fa-comment-dots text-amber-400"></i><span>الملاحظات</span>
        </h2>
        <button type="button" data-close-remarks class="w-9 h-9 rounded-full bg-slate-900 hover:bg-red-600 border border-slate-700 text-white flex items-center justify-center" aria-label="إغلاق">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="p-4 sm:p-5">
        <form id="emailRemarkForm" class="space-y-3">
          <div>
            <label for="emailRemarkText" class="block text-xs font-semibold text-slate-300 mb-1.5">
              <i class="fa-solid fa-pen-to-square ml-1 text-slate-400"></i>
              ملاحظتك <span class="text-rose-400">*</span>
            </label>
            <textarea id="emailRemarkText" name="monTexte" rows="5" required placeholder="اكتب ملاحظتك هنا…" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500 placeholder-slate-500 resize-y" dir="auto"></textarea>
          </div>
          <div id="emailRemarkStatus" class="hidden rounded-lg px-3 py-2 text-sm" role="status"></div>
          <button type="submit" id="emailRemarkBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 disabled:opacity-60">
            <i class="fa-solid fa-paper-plane"></i><span>إرسال</span>
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- ============ EXIT CONFIRM ============ -->
<div id="exitConfirmModal" class="fixed inset-0 z-[80] hidden">
  <div class="absolute inset-0 bg-black/75 backdrop-blur-sm" data-exit-cancel></div>
  <div class="relative z-10 w-full h-full flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-800 rounded-2xl border border-slate-700 shadow-2xl overflow-hidden">
      <div class="p-5 sm:p-6 text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-amber-500/15 mb-4">
          <i class="fa-solid fa-right-from-bracket text-2xl text-amber-400"></i>
        </div>
        <h2 class="text-lg font-bold text-white mb-2">مغادرة المعرض؟</h2>
        <p class="text-sm text-slate-300">هل تريد فعلاً مغادرة الأرشيف المؤسساتي؟</p>
      </div>
      <div class="flex flex-col sm:flex-row gap-2 p-4 bg-slate-900/40 border-t border-slate-700">
        <button type="button" data-exit-cancel class="flex-1 px-4 py-2.5 bg-slate-700 hover:bg-slate-600 text-white text-sm font-semibold rounded-xl flex items-center justify-center gap-2">
          <i class="fa-solid fa-arrow-right"></i><span>البقاء</span>
        </button>
        <button type="button" data-exit-confirm class="flex-1 px-4 py-2.5 bg-rose-600 hover:bg-rose-700 text-white text-sm font-semibold rounded-xl flex items-center justify-center gap-2">
          <i class="fa-solid fa-right-from-bracket"></i><span>مغادرة</span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Script principal -->
<script src="js/app.js"></script>

</body>
</html>
