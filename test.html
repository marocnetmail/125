
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">

<title>اختبار مشغل YouTube</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:30px 16px;
  font-family:"Segoe UI",Tahoma,Arial,sans-serif;
  background:#0b1220;
  color:#e6ecf7;
}

.container{
  max-width:850px;
  margin:auto;
}

h1{
  font-size:24px;
  color:#38bdf8;
  margin-bottom:8px;
}

.subtitle{
  color:#94a3b8;
  margin-bottom:25px;
}

.card{
  background:#141c2e;
  border:1px solid #243049;
  border-radius:18px;
  overflow:hidden;
}

.video{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
}

.video iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
}

.info{
  padding:20px;
}

.title{
  font-size:18px;
  line-height:1.7;
  margin:0 0 12px;
}

.channel{
  color:#38bdf8;
  font-size:14px;
}

.status{
  margin-top:18px;
  padding:12px;
  background:#1b2437;
  border-radius:10px;
  color:#94a3b8;
  font-size:13px;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}

button,a{
  border:0;
  border-radius:9px;
  padding:11px 17px;
  font-size:14px;
  cursor:pointer;
  text-decoration:none;
}

button{
  background:#0284c7;
  color:white;
}

a{
  background:#dc2626;
  color:white;
}

</style>
</head>

<body>

<div class="container">

<h1>فيديوهات السكن والتعمير</h1>

<div class="subtitle">
اختبار تشغيل فيديو YouTube داخل الصفحة
</div>

<div class="card">

  <div class="video" id="videoContainer">

    <iframe
      id="youtubePlayer"
      title="YouTube video player"
      src="https://www.youtube.com/embed/DPxXriyHg8E?autoplay=0&rel=0&playsinline=1&enablejsapi=1"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>

  </div>

  <div class="info">

    <h2 class="title">
      شحال من واحد استافد من برنامج دعم السكن في المغرب؟
    </h2>

    <div class="channel">
      📺 MEDI1 TV
    </div>

    <div class="status" id="status">
      مشغل YouTube جاهز للاختبار.
    </div>

    <div class="actions">

      <button onclick="reloadVideo()">
        إعادة تحميل الفيديو
      </button>

      <a
        href="https://www.youtube.com/watch?v=DPxXriyHg8E"
        target="_blank"
        rel="noopener noreferrer">
        مشاهدة على YouTube
      </a>

    </div>

  </div>

</div>

</div>

<script>

const VIDEO_ID = "DPxXriyHg8E";

function reloadVideo(){

  const player = document.getElementById("youtubePlayer");

  const params = new URLSearchParams({
    autoplay:"0",
    rel:"0",
    playsinline:"1",
    enablejsapi:"1",
    origin:window.location.origin
  });

  player.src =
    "https://www.youtube.com/embed/" +
    VIDEO_ID + "?" + params.toString();

  document.getElementById("status").textContent =
    "تمت إعادة تحميل مشغل الفيديو.";

}

</script>

</body>
</html>
