<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Vidéothèque – Médias</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111c2e;--muted:#9aa9bd;--text:#edf3fb;--accent:#e11d48;--line:#26364d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,Segoe UI,Arial,sans-serif}
header{padding:25px max(18px,calc((100% - 1240px)/2));background:linear-gradient(120deg,#172b46,#101827);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:clamp(22px,3vw,32px)}header p{margin:6px 0 0;color:var(--muted)}main{max-width:1240px;margin:auto;padding:22px 18px 60px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.toolbar input,.toolbar select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 13px;min-width:190px;outline:none}.toolbar input{flex:1}
.status{color:var(--muted);font-size:13px;margin:0 0 18px}.group{margin:28px 0}.group h2{font-size:19px;margin:0 0 13px;border-bottom:1px solid var(--line);padding-bottom:9px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;min-width:0}.thumb{position:relative;aspect-ratio:16/9;background:#050a12;display:block}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.play{position:absolute;inset:0;display:grid;place-items:center;background:#0002}.play span{width:38px;height:38px;border-radius:50%;background:#e11d48e8;display:grid;place-items:center;color:#fff;font-size:16px;padding-left:2px;box-shadow:0 3px 12px #0008;transition:transform .2s}.card:hover .play span{transform:scale(1.1)}
.info{padding:12px 13px}.title{font-weight:650;line-height:1.35;margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.source{color:#b8c7da;font-size:13px}.meta{display:flex;gap:9px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:7px}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.modal{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.open{display:flex}.modalbox{width:min(960px,100%);background:#0d1727;border:1px solid var(--line);border-radius:14px;overflow:hidden}.modalhead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}.modalhead strong{padding-right:12px}.close{background:#26364d;border:0;color:white;border-radius:8px;padding:8px 12px;cursor:pointer}.player{aspect-ratio:16/9;background:#000}.player iframe{width:100%;height:100%;border:0}.foot{color:var(--muted);font-size:12px;margin-top:25px}
@media(max-width:560px){.toolbar input,.toolbar select{width:100%;min-width:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.info{padding:9px}.title{font-size:13px}.source{font-size:12px}}
</style></head><body>
<header><h1>Vidéothèque – Médias</h1><p>Vidéos classées par source média</p></header>
<main><div class="toolbar"><input id="search" type="search" placeholder="Rechercher un titre…" aria-label="Rechercher un titre"><select id="sourceFilter"><option value="">Toutes les sources</option></select><select id="sort"><option value="date">Plus récentes</option><option value="views">Plus vues</option><option value="title">Titre A–Z</option></select></div>
<p class="status" id="status">Chargement des fichiers JSON…</p><div id="gallery"></div><p class="foot">Les vidéos sans titre ou sans source média sont automatiquement ignorées.</p></main>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="modalbox"><div class="modalhead"><strong id="modalTitle"></strong><button class="close" id="close">Fermer ✕</button></div><div class="player" id="player"></div></div></div>
<script>
const OWNER='marocnetmail', REPO='125', BRANCH='main', JSON_DIR='json';
const $=s=>document.querySelector(s); let allVideos=[];
const first=(o,keys)=>{for(const k of keys){const v=o?.[k];if(v!==undefined&&v!==null&&String(v).trim()!=='')return v;}return ''};
function cleanText(v){return String(v??'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim()}
function getVideoId(url){if(!url)return '';try{const u=new URL(url);if(u.hostname.includes('youtu.be'))return u.pathname.slice(1);if(u.searchParams.get('v'))return u.searchParams.get('v');const m=u.pathname.match(/\/embed\/([\w-]+)/);return m?m[1]:''}catch{return ''}}
function normalize(x){const title=cleanText(first(x,['title','titre','name','video_title','nom']));const source=cleanText(first(x,['channel','channel_name','source','media','page','publisher','nom_media','chaine','chaîne']));const url=first(x,['url','video_url','youtube_url','link','lien']);const id=first(x,['videoId','video_id','youtube_id','id_youtube'])||getVideoId(url);if(!title||!source||(!url&&!id))return null;const videoUrl=url||('https://www.youtube.com/watch?v='+id);const thumb=first(x,['thumbnail','thumb','miniature','image','thumbnail_url'])||(id?'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg':'');return {title,source,url:videoUrl,id:getVideoId(videoUrl)||id,thumb,date:first(x,['published','published_at','date','date_iso','publication_date']),views:Number(String(first(x,['views','view_count','vues','nbre_vue'])||0).replace(/[^0-9.]/g,''))||0,sourceUrl:first(x,['channel_url','source_url','page_url'])};}
function extractRows(data){if(Array.isArray(data))return data;if(data&&typeof data==='object'){for(const k of ['videos','items','data','results','reels'])if(Array.isArray(data[k]))return data[k];return Object.values(data).filter(v=>v&&typeof v==='object'&&!Array.isArray(v));}return [];}
async function load(){try{const api=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${JSON_DIR}?ref=${BRANCH}`;const res=await fetch(api,{headers:{'Accept':'application/vnd.github+json'}});if(!res.ok)throw new Error('GitHub API : '+res.status);const files=await res.json();const jsonFiles=files.filter(f=>f.type==='file'&&f.name.toLowerCase().endsWith('.json'));if(!jsonFiles.length)throw new Error('Aucun fichier JSON trouvé dans le dossier '+JSON_DIR+'/');const batches=await Promise.all(jsonFiles.map(async f=>{const r=await fetch(f.download_url);if(!r.ok)throw new Error('Lecture impossible : '+f.name);return r.json()}));const rows=batches.flatMap(extractRows);const seen=new Set();allVideos=rows.map(normalize).filter(Boolean).filter(v=>{const key=v.id||v.url;if(seen.has(key))return false;seen.add(key);return true;});fillSources();render();const ignored=rows.length-allVideos.length;$('#status').textContent=`${allVideos.length} vidéo(s) affichée(s) · ${ignored} entrée(s) ignorée(s) (titre, source ou lien manquant) · ${jsonFiles.length} fichier(s) JSON`;if(!allVideos.length)$('#gallery').innerHTML='<div class="empty">Aucune vidéo complète trouvée. Vérifiez les champs titre, source et URL dans les fichiers JSON.</div>';}catch(e){$('#status').textContent='Erreur de chargement : '+e.message;$('#gallery').innerHTML='<div class="empty">Impossible de charger les fichiers JSON. Vérifiez le dépôt GitHub et le dossier json/.</div>';}}
function fillSources(){const sel=$('#sourceFilter');[...new Set(allVideos.map(v=>v.source))].sort((a,b)=>a.localeCompare(b,'fr')).forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;sel.append(o)});}
function render(){const q=$('#search').value.trim().toLocaleLowerCase('fr'),source=$('#sourceFilter').value,sort=$('#sort').value;let rows=allVideos.filter(v=>(!q||v.title.toLocaleLowerCase('fr').includes(q))&&(!source||v.source===source));rows.sort((a,b)=>sort==='views'?b.views-a.views:sort==='title'?a.title.localeCompare(b.title,'fr'):String(b.date).localeCompare(String(a.date)));const groups=new Map();for(const v of rows){if(!groups.has(v.source))groups.set(v.source,[]);groups.get(v.source).push(v)}const root=$('#gallery');root.innerHTML='';if(!rows.length){root.innerHTML='<div class="empty">Aucune vidéo ne correspond aux critères. Les vidéos sans titre ou sans source ne sont jamais affichées.</div>';return}for(const [name,list] of groups){const section=document.createElement('section');section.className='group';const h=document.createElement('h2');h.textContent=`${name} (${list.length})`;section.append(h);const grid=document.createElement('div');grid.className='grid';list.forEach(v=>grid.append(makeCard(v)));section.append(grid);root.append(section)}}
function makeCard(v){const card=document.createElement('article');card.className='card';const a=document.createElement('a');a.href='#';a.className='thumb';a.setAttribute('aria-label','Lire '+v.title);a.addEventListener('click',e=>{e.preventDefault();openVideo(v)});const img=document.createElement('img');img.loading='lazy';img.alt=v.title;img.src=v.thumb;img.onerror=()=>{img.src='https://placehold.co/640x360/111c2e/9aa9bd?text=Miniature+indisponible';};const play=document.createElement('div');play.className='play';const icon=document.createElement('span');icon.textContent='▶';play.append(icon);a.append(img,play);const info=document.createElement('div');info.className='info';const title=document.createElement('p');title.className='title';title.textContent=v.title;const src=document.createElement('div');src.className='source';src.textContent=v.source;const meta=document.createElement('div');meta.className='meta';if(v.date)meta.append(document.createTextNode(v.date));if(v.views)meta.append(document.createTextNode(v.views.toLocaleString('fr-FR')+' vues'));info.append(title,src,meta);card.append(a,info);return card}
function openVideo(v){if(!v.id){window.open(v.url,'_blank','noopener');return}$('#modalTitle').textContent=v.title;const iframe=document.createElement('iframe');iframe.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(v.id)+'?autoplay=1&rel=0';iframe.title=v.title;iframe.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';iframe.allowFullscreen=true;iframe.referrerPolicy='strict-origin-when-cross-origin';$('#player').replaceChildren(iframe);$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open');$('#player').replaceChildren()}
$('#search').addEventListener('input',render);$('#sourceFilter').addEventListener('change',render);$('#sort').addEventListener('change',render);$('#close').addEventListener('click',closeModal);$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});load();
</script></body></html>
