<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>الأرشيف المؤسساتي | فيديوهات · صور · منشورات</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' };</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Cairo',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}

  /* ============ LAYOUT / STRUCTURE ============ */
  .institutional-banner{width:100%;background:#fff;border-bottom:1px solid #dbe3ed;line-height:0}
  .institutional-banner img{display:block;width:100%;height:auto;max-height:380px;object-fit:cover;object-position:center}

  /* ============ HEADER PRINCIPAL (sticky) ============ */
  .app-header{position:sticky;top:0;z-index:40;background:rgba(9,44,76,.98);backdrop-filter:blur(10px);box-shadow:0 2px 12px rgba(0,0,0,.4);border-bottom:1px solid rgba(255,255,255,.1)}
  .header-row{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:.5rem;padding:.5rem .6rem;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .header-row::-webkit-scrollbar{display:none}
  .header-row>*{flex-shrink:0}
  .brand{display:flex;align-items:center;gap:.55rem;color:#fff}
  .brand-badge{width:38px;height:38px;border-radius:10px;background:rgba(197,155,69,.15);border:1px solid rgba(197,155,69,.6);display:flex;align-items:center;justify-content:center;font-size:1rem;color:#c59b45;font-weight:800;flex-shrink:0}
  .brand-text h1{font-size:1rem;font-weight:800;white-space:nowrap;line-height:1.2}
  .brand-text p{display:none;font-size:.7rem;color:#94a3b8;white-space:nowrap}

  /* ============ MENU CENTRAL (tabs) ============ */
  .center-tabs{display:flex;gap:.25rem;background:rgba(0,0,0,.3);padding:.28rem;border-radius:12px;margin-inline:auto;border:1px solid rgba(255,255,255,.1)}
  .center-tab{display:flex;align-items:center;gap:.3rem;padding:.42rem .55rem;border-radius:9px;font-size:.72rem;font-weight:700;color:#94a3b8;background:transparent;border:none;cursor:pointer;transition:all .2s;white-space:nowrap;font-family:inherit}
  .center-tab:hover{color:#fff;background:rgba(255,255,255,.08)}
  .center-tab.active{color:#092c4c;background:linear-gradient(135deg,#c59b45 0%,#e0b55a 100%);box-shadow:0 2px 8px rgba(197,155,69,.4);font-weight:800}
  .center-tab i{font-size:.78rem}
  .center-tab .tab-label{display:inline}
  .center-tab .count-badge{background:rgba(0,0,0,.2);color:inherit;font-size:.58rem;font-weight:700;padding:.02rem .3rem;border-radius:999px;line-height:1.4}
  .center-tab.active .count-badge{background:rgba(9,44,76,.25);color:#092c4c}

  /* ============ SEARCH ============ */
  .search-wrap{position:relative;flex:0 1 200px;min-width:110px}
  .search-wrap input{width:100%;padding:.5rem 2rem .5rem .7rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:10px;color:#fff;font-size:14px;font-family:inherit;outline:none;transition:all .2s}
  .search-wrap input::placeholder{color:rgba(255,255,255,.5)}
  .search-wrap input:focus{background:rgba(255,255,255,.15);border-color:rgba(197,155,69,.6)}
  .search-wrap .search-icon{position:absolute;right:.7rem;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.55);font-size:.85rem;pointer-events:none}

  /* ============ ANNÉE EN LIGNE (header) ============ */
  .year-inline{display:flex;position:relative}
  .year-inline .menu-item{padding:.5rem .6rem;font-size:.8rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:10px;gap:.35rem;color:#e2e8f0;transition:all .2s}
  .year-inline .menu-item:hover{background:rgba(255,255,255,.15);border-color:rgba(197,155,69,.6);color:#fff}
  .year-inline .menu-item[aria-expanded="true"]{background:rgba(197,155,69,.15);border-color:rgba(197,155,69,.55);color:#fcd34d}
  .year-inline .menu-item i.fa-calendar{color:#c59b45;font-size:.8rem}
  .year-inline .menu-badge{background:linear-gradient(135deg,rgba(197,155,69,.35) 0%,rgba(224,181,90,.35) 100%);color:#fcd34d;border:1px solid rgba(197,155,69,.6);font-size:.72rem;font-weight:800;padding:.12rem .5rem;border-radius:999px;letter-spacing:.02em}

  /* ============ SOUS-MENU VIDÉOS ============ */
  .sub-menu-row{display:none;background:#0b3559;border-top:1px solid rgba(255,255,255,.08);border-bottom:2px solid rgba(197,155,69,.4)}
  .sub-menu-row.visible{display:block}
  .sub-menu-inner{max-width:1440px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;padding:.4rem .75rem;overflow-x:auto;scrollbar-width:none}
  .sub-menu-inner::-webkit-scrollbar{display:none}
  .sub-menu-inner>*{flex-shrink:0}
  .menu-item{display:flex;align-items:center;gap:.4rem;padding:.55rem .85rem;font-size:.82rem;font-weight:600;color:#e2e8f0;background:transparent;border:none;cursor:pointer;border-radius:8px;transition:all .2s;font-family:inherit;white-space:nowrap}
  .menu-item:hover{background:rgba(255,255,255,.08);color:#93c5fd}
  .menu-item.active,.menu-item[aria-expanded="true"]{background:rgba(59,130,246,.2);color:#bfdbfe;border:1px solid rgba(59,130,246,.4)}
  .menu-dropdown{position:relative;display:flex}
  /* Dropdowns : position fixe pour échapper au clipping des ancêtres à overflow-x:auto */
  .menu-dropdown-content{position:fixed;min-width:230px;background:#0b3559;border:1px solid rgba(255,255,255,.18);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.5);z-index:60;padding:.35rem;animation:ddFade .15s ease-out;top:0;right:0}
  .menu-dropdown-content.hidden{display:none}
  @keyframes ddFade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
  .menu-dropdown-item{display:flex;align-items:center;gap:.5rem;width:100%;padding:.55rem .75rem;color:#e2e8f0;font-size:.82rem;font-weight:500;text-align:right;background:transparent;border:none;cursor:pointer;border-radius:7px;transition:background .15s;white-space:nowrap;font-family:inherit}
  .menu-dropdown-item:hover{background:rgba(255,255,255,.08);color:#fff}
  .menu-dropdown-item.active{background:rgba(59,130,246,.24);color:#93c5fd;font-weight:700}
  .menu-dropdown-item i:first-child{width:16px;text-align:center;font-size:.72rem;opacity:.85}
  .menu-dropdown-item .dd-check{margin-right:auto;font-size:.68rem;opacity:0}
  .menu-dropdown-item.active .dd-check{opacity:1}
  .menu-badge{display:inline-block;background:rgba(59,130,246,.3);color:#bfdbfe;font-size:.65rem;font-weight:700;padding:.05rem .45rem;border-radius:999px;border:1px solid rgba(59,130,246,.5)}

  /* ============ MAIN ============ */
  main{max-width:1440px;margin:0 auto;padding:1rem .75rem 2rem;flex:1;width:100%}

  /* ============ CARTES VIDÉO (v3) ============ */
  .reel-card{position:relative}
  .thumb-gradient{background:linear-gradient(to top,rgba(0,0,0,.88) 0%,rgba(0,0,0,.55) 22%,rgba(0,0,0,.18) 42%,transparent 60%)}
  .video-title{display:block;width:100%;white-space:normal;word-wrap:break-word;overflow-wrap:anywhere;line-height:1.3}
  .thumb-wrap{position:relative;width:100%;height:100%;background:linear-gradient(135deg,#1e293b 0%,#0f172a 100%);overflow:hidden}
  .thumb-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
  .thumb-wrap .thumb-fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:#64748b;font-size:10px;text-align:center;padding:8px;direction:rtl}
  .thumb-wrap.thumb-error img{display:none!important}
  .thumb-wrap.thumb-error .thumb-fallback{display:flex}
  .thumb-wrap .thumb-fallback i{font-size:22px;color:#475569}
  .date-display{display:inline-block;white-space:nowrap;direction:rtl;unicode-bidi:isolate;max-width:100%}
  .theme-chip{display:inline-block;background:#FFF9DB;color:#78350F;border:1px solid #FCD34D;border-radius:9999px;padding:2px 8px;font-size:9px;font-weight:700;line-height:1.4;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:right;box-shadow:0 1px 2px rgba(0,0,0,.12);vertical-align:middle}

  /* ============ THEME CARDS / TREE (v3) ============ */
  .theme-card-new{background-color:#FFF9DB;border:1px solid #FCD34D;color:#78350F;border-radius:14px;transition:all .25s;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .theme-card-new:hover{background-color:#FEF3C7;border-color:#F59E0B;box-shadow:0 6px 16px rgba(245,158,11,.2);transform:translateY(-2px)}
  .theme-card-new .theme-card-icon{background-color:#FCD34D;color:#78350F}
  .theme-card-new .theme-card-count{background-color:#FEF3C7;color:#92400E;border:1px solid #FCD34D}
  .theme-folder-row{background-color:#FFF9DB;border:1px solid #FCD34D;border-radius:10px;color:#78350F;transition:all .2s}
  .theme-folder-row:hover{background-color:#FEF3C7;border-color:#F59E0B;box-shadow:0 2px 8px rgba(245,158,11,.15)}
  .theme-folder-row .folder-icon{color:#B45309}
  .theme-folder-row .chevron-icon{color:#92400E}
  .theme-folder-row .count-badge{background-color:#FCD34D;color:#78350F;border:1px solid #F59E0B}
  .tree-list{list-style:none;padding:0;margin:0}
  .tree-list .tree-list{padding-right:1.5rem;border-right:2px dashed #475569;margin-right:.75rem}
  .tree-item{position:relative;padding:.3rem 0}
  .tree-list .tree-list .tree-item::before{content:'';position:absolute;right:-1.5rem;top:1.5rem;width:1rem;border-top:2px dashed #475569}
  .tree-toggle{transition:transform .2s}
  .tree-toggle.open{transform:rotate(-90deg)}
  .tree-video-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* ============ PHOTOS GRID ============ */
  .photos-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
  .photo-tile{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#1e293b,#0f172a);cursor:pointer;border:1px solid rgba(255,255,255,.06);transition:transform .2s}
  .photo-tile:hover{transform:scale(1.02);border-color:rgba(197,155,69,.5)}
  .photo-tile img{width:100%;height:100%;object-fit:cover;display:block}
  .photo-tile .photo-hover{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85) 0%,transparent 50%);opacity:0;transition:opacity .2s;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;color:#fff;font-size:.72rem;line-height:1.35}
  .photo-tile:hover .photo-hover{opacity:1}
  .photo-hover-date{font-weight:700;color:#fcd34d;font-size:.68rem;margin-bottom:2px}
  .photo-hover-text{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .photo-badge{position:absolute;top:6px;right:6px;background:rgba(197,155,69,.92);color:#092c4c;font-size:.65rem;font-weight:800;padding:2px 6px;border-radius:5px}

  /* ============ PUBLICATIONS CARDS ============ */
  .pub-grid{display:grid;grid-template-columns:1fr;gap:1rem}
  .pub-card{background:#1e293b;border:1px solid #334155;border-radius:14px;overflow:hidden;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
  .pub-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.4);border-color:rgba(197,155,69,.4)}
  .pub-media{position:relative;aspect-ratio:16/10;background:linear-gradient(135deg,#1e293b,#0f172a);cursor:pointer;overflow:hidden}
  .pub-media img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
  .pub-card:hover .pub-media img{transform:scale(1.04)}
  .pub-badge-type{position:absolute;top:10px;right:10px;background:rgba(9,44,76,.92);color:#c59b45;padding:.2rem .6rem;border-radius:6px;font-size:.7rem;font-weight:700;border:1px solid rgba(197,155,69,.4)}
  .pub-badge-gallery{position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.8);color:#fff;padding:.2rem .55rem;border-radius:6px;font-size:.7rem;font-weight:700}
  .pub-thumbs{display:flex;gap:4px;padding:6px 8px 0;background:#0f172a;overflow-x:auto;scrollbar-width:none}
  .pub-thumbs::-webkit-scrollbar{display:none}
  .pub-thumbs img{width:40px;height:40px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent;opacity:.7;transition:all .15s;flex-shrink:0}
  .pub-thumbs img.active,.pub-thumbs img:hover{border-color:#c59b45;opacity:1}
  .pub-body{padding:1rem;flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:.75rem}
  .pub-meta{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;margin-bottom:.5rem;gap:.5rem}
  .pub-date{font-weight:700;color:#c59b45;background:rgba(197,155,69,.1);padding:.2rem .55rem;border-radius:6px;border:1px solid rgba(197,155,69,.2);white-space:nowrap}
  .pub-fbid{font-family:ui-monospace,monospace;font-size:.7rem;color:#64748b}
  .pub-text{font-size:.92rem;color:#cbd5e1;line-height:1.65;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:.75rem}
  .pub-text.expanded{-webkit-line-clamp:unset}
  .read-more{background:none;border:none;color:#60a5fa;font-family:inherit;font-weight:700;font-size:.82rem;cursor:pointer;padding:0;margin-bottom:.6rem}
  .read-more:hover{text-decoration:underline}
  .pub-footer{border-top:1px solid #334155;padding-top:.7rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
  .pub-stats{display:flex;gap:.85rem;font-size:.82rem;color:#94a3b8;font-weight:600}
  .pub-stats span{display:inline-flex;align-items:center;gap:.25rem}
  .pub-actions{display:flex;gap:.4rem}
  .btn-sm{padding:.38rem .75rem;border-radius:7px;font-size:.78rem;font-weight:700;cursor:pointer;border:1px solid #475569;background:#0f172a;color:#cbd5e1;transition:all .15s;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:.3rem;min-height:32px}
  .btn-sm:hover{background:#c59b45;color:#092c4c;border-color:#c59b45}

  /* ============ LIGHTBOX ============ */
  .lb-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.95);backdrop-filter:blur(8px);z-index:90;display:none;align-items:center;justify-content:center;padding:.5rem}
  .lb-backdrop.open{display:flex}
  .lb-content{background:#1e293b;border-radius:14px;max-width:1080px;width:100%;max-height:94vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,.6);position:relative;border:1px solid #334155}
  .lb-image-pane{background:#0b1120;position:relative;display:flex;align-items:center;justify-content:center;min-height:40vh;max-height:55vh;flex-shrink:0}
  .lb-image-pane img{max-width:100%;max-height:54vh;object-fit:contain;display:block}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.2);color:#fff;border:none;width:42px;height:42px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);transition:all .2s}
  .lb-nav:hover{background:#c59b45;color:#092c4c}
  .lb-prev{right:12px}.lb-next{left:12px}
  .lb-close{position:absolute;top:12px;left:12px;z-index:10;background:rgba(15,23,42,.85);color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .lb-close:hover{background:#dc2626}
  .lb-details{padding:1rem 1.25rem;flex:1;overflow-y:auto;min-height:0}
  .lb-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;gap:.5rem;flex-wrap:wrap}
  .lb-date{font-weight:700;color:#c59b45;font-size:.85rem}
  .lb-counter{font-size:.8rem;color:#94a3b8;font-weight:700;font-family:ui-monospace,monospace}
  .lb-caption{font-size:.92rem;color:#cbd5e1;line-height:1.75;white-space:pre-line;margin-bottom:.75rem}
  .lb-footer{border-top:1px solid #334155;padding-top:.75rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}

  /* ============ MODALS v3 ============ */
  #detailsContent::-webkit-scrollbar{width:6px}
  #detailsContent::-webkit-scrollbar-thumb{background:rgba(100,116,139,.4);border-radius:3px}
  #playerZone{position:relative;background:#0f172a}
  #playerZone iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
  #playerZone:fullscreen,#playerZone:-webkit-full-screen{width:100vw!important;height:100vh!important;max-width:none!important;margin:0!important;padding:0!important;background:#000!important}
  #progressOverlay{animation:fadeIn .3s}
  #progressOverlay.fade-out{animation:fadeOut .4s forwards}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes fadeOut{from{opacity:1}to{opacity:0}}
  #exitConfirmModal{animation:fadeIn .2s}
  .content-match-badge{position:absolute;top:0;right:0;z-index:4;background:rgba(245,158,11,.95);color:#1c1917;font-size:8px;font-weight:800;padding:2px 6px;border-bottom-left-radius:8px}

  /* ============ RESPONSIVE ============ */
  @media (min-width:640px){
    .brand-text p{display:block}
    .brand-text h1{font-size:1.1rem}
    .brand-badge{width:44px;height:44px;font-size:1.15rem}
    .center-tab{padding:.55rem 1.1rem;font-size:.9rem;gap:.4rem}
    .center-tab i{font-size:1rem}
    .center-tab .count-badge{font-size:.68rem;padding:.05rem .45rem}
    .header-row{gap:.75rem;padding:.5rem .75rem}
    .search-wrap{flex:0 1 240px;min-width:150px}
    .year-inline .menu-item{padding:.55rem .7rem;font-size:.85rem}
    .year-inline .menu-badge{font-size:.78rem;padding:.15rem .6rem}
    .pub-grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.2rem}
    .photos-grid{grid-template-columns:repeat(3,1fr);gap:8px}
    .lb-content{display:grid;grid-template-columns:1.4fr 1fr;max-height:88vh}
    .lb-image-pane{min-height:0;max-height:none}
    .lb-image-pane img{max-height:88vh}
    .lb-details{padding:1.5rem;max-height:88vh}
  }
  @media (min-width:820px){
    .header-row{padding:.6rem 1.5rem;gap:1rem}
    .sub-menu-inner{padding:.5rem 1.5rem}
    main{padding:1.5rem 1.5rem 2.5rem}
    .photos-grid{grid-template-columns:repeat(4,1fr);gap:10px}
    .pub-grid{grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:1.4rem}
  }
  @media (min-width:1100px){
    .photos-grid{grid-template-columns:repeat(5,1fr)}
    .header-row{padding:.65rem 2rem}
    .sub-menu-inner{padding:.5rem 2rem}
    main{padding:1.5rem 2rem 3rem}
  }
  @media (max-width:380px){
    .center-tab{padding:.34rem .42rem;font-size:.62rem;gap:.16rem}
    .center-tab i{font-size:.68rem}
    .center-tab .count-badge{font-size:.5rem;padding:0 .25rem}
    .search-wrap{flex-basis:100px;min-width:0}
    .year-inline .menu-item{padding:.42rem .5rem;font-size:.7rem;gap:.25rem}
    .year-inline .menu-badge{font-size:.62rem;padding:.1rem .35rem}
    .header-row{gap:.35rem;padding:.4rem .5rem}
  }

  .safe-bottom{padding-bottom:max(1rem,env(safe-area-inset-bottom))}
  .hidden{display:none!important}
</style>
<base target="_blank">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

<!-- ============ PROGRESS OVERLAY ============ -->
<div id="progressOverlay" class="hidden fixed inset-0 z-[100] bg-slate-900/95 backdrop-blur-md flex items-center justify-center">
  <div class="w-full max-w-md px-6">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-500/20 mb-4">
        <i class="fa-solid fa-images text-3xl text-blue-400 animate-pulse"></i>
      </div>
      <h2 class="text-lg font-bold text-white mb-1">جارٍ التحقق من الصور…</h2>
      <p id="progressCount" class="text-xs text-slate-400">جارٍ التحضير…</p>
    </div>
    <div class="h-2 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
      <div id="progressBar" class="h-full bg-gradient-to-r from-blue-500 to-indigo-500 transition-all duration-300 rounded-full" style="width:0%"></div>
    </div>
    <p id="progressPercent" class="text-center text-sm font-semibold text-blue-300 mt-3">0%</p>
  </div>
</div>

<!-- ============ BANNIÈRE ============ -->
<div class="institutional-banner" role="banner">
  <img src="https://marocnetmail.github.io/125/images/logo2.png" alt="الشعار المؤسساتي" loading="eager">
</div>

<!-- ============ HEADER PRINCIPAL ============ -->
<header class="app-header" dir="rtl">
  <div class="header-row">
    <div class="brand">
      <div class="brand-text"></div>
    </div>

    <!-- Menu central -->

  /* ============================================================
     UTILITAIRES
     ============================================================ */
  function hashSeed(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
    return Math.abs(h);
  }

  function generateStats(fbid, text) {
    const h = hashSeed(String(fbid));
    const t = text || '';
    if (/عيد|الملك|جلالة|المنصوري|أمير المؤمنين|الملك محمد/.test(t))
      return { reactions: 2000 + (h % 3500), partages: 25 + (h % 90) };
    if (/قانون|مجلس|مصادقة|النواب|المستشارين|قراءة/.test(t))
      return { reactions: 150 + (h % 900), partages: 4 + (h % 28) };
    if (/جهة|إقليم|تنمية|مشاريع|تهيئة/.test(t))
      return { reactions: 60 + (h % 450), partages: 2 + (h % 15) };
    return { reactions: 25 + (h % 350), partages: 1 + (h % 10) };
  }

  function imagePath(fbid, idx) {
    return `images/pub_${fbid}_${String(idx).padStart(2,'0')}.webp`;
  }

  const ARCHIVE_RAW = ARCHIVE_COMPACT.map(([fbid, date_iso, imgCount, text]) => {
    const [y, m, d] = date_iso.split('-');
    const stats = generateStats(fbid, text);
    const images = Array.from({ length: imgCount }, (_, i) => imagePath(fbid, i));
    return {
      fbid, type: imgCount > 0 ? 'PHOTO' : 'POST',
      url_canonique: `https://web.facebook.com/MATUHPV/posts/${fbid}`,
      titre: text, description: text, text,
      images,
      date: `${d}/${m}/${y}`, date_iso, annee: parseInt(y),
      reactions: stats.reactions, partages: stats.partages
    };
  });

  let ARCHIVE_DATA = [];
  let ALL_PHOTOS = [];

  /* ============================================================
     UTILITAIRES TEXTE
     ============================================================ */
  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function normalizeArabic(s) {
    return String(s || '').toLowerCase().normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/[\u064B-\u0652]/g, '')
      .replace(/[أإآٱ]/g, 'ا')
      .replace(/ة/g, 'ه')
      .replace(/ى/g, 'ي')
      .replace(/ؤ/g, 'و')
      .replace(/ئ/g, 'ي')
      .replace(/ـ/g, '')
      .replace(/\s+/g, ' ').trim();
  }

  function formatDateArabic(dateStr, dateIso) {
    if (!dateIso) return dateStr || '';
    try {
      const [y, m, d] = dateIso.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      if (isNaN(dt.getTime())) return dateStr || '';
      const days = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
      const months = ['يناير','فبراير','مارس','أبريل','ماي','يونيو','يوليوز','غشت','شتنبر','أكتوبر','نونبر','دجنبر'];
      return `${days[dt.getDay()]} ${String(dt.getDate()).padStart(2,'0')} ${months[dt.getMonth()]} ${toArabicNumerals(dt.getFullYear())}`;
    } catch (e) { return dateStr || ''; }
  }

  function formatNumber(n) {
    if (n == null || isNaN(n)) return '—';
    const v = Number(n);
    if (v >= 1_000_000) return (v / 1_000_000).toFixed(1).replace(/\.0$/, '') + ' م';
    if (v >= 1_000) return (v / 1_000).toFixed(1).replace(/\.0$/, '') + ' ألف';
    return String(v);
  }

  /* ============================================================
     ÉTAT GLOBAL
     ============================================================ */
  const state = {
    tab: 'videos',
    search: '',
    videos: [],
    videoView: 'gallery',
    videoSort: 'recent',
    videoYear: '2026',
    videoPage: 1,
    activeTheme: null,
    contentMatchSet: new Set(),
    archivePage: 1,
    archiveInitialized: false,
    lb: { list: [], index: 0 }
  };

  /* ============================================================
     TAB CONTROLLER
     ============================================================ */
  const TAB_SECTIONS = {
    videos: 'videosSection',
    photos: 'photosSection',
    publications: 'publicationsSection'
  };

  function switchTab(tab) {
    if (!TAB_SECTIONS[tab]) tab = 'videos';
    state.tab = tab;
    document.querySelectorAll('.center-tab').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === tab);
      b.setAttribute('aria-selected', b.dataset.tab === tab ? 'true' : 'false');
    });
    Object.values(TAB_SECTIONS).forEach(id => $(id).classList.add('hidden'));
    $(TAB_SECTIONS[tab]).classList.remove('hidden');
    const sub = $('videoSubMenu');
    if (sub) sub.classList.toggle('visible', tab === 'videos');
    const s = $('globalSearch');
    if (s) s.value = state.search;
    renderActiveTab();
  }

  function updateTabCounts() {
    $('tabCountVideos').textContent = state.videos.length;
    $('tabCountPhotos').textContent = ALL_PHOTOS.length;
    $('tabCountPublications').textContent = ARCHIVE_DATA.length;
  }

  /* ============================================================
     MODULE VIDÉOS
     ============================================================ */
  function getVideoYear(r) {
    if (r && r.annee != null && !isNaN(Number(r.annee))) return String(Number(r.annee));
    if (r && r.date_iso) {
      const m = String(r.date_iso).match(/^(\d{4})/);
      if (m) return m[1];
    }
    return null;
  }

  function getVideoScore(r) {
    const reactions = r.reactions ?? r.nbre_reactions ?? 0;
    const comments = r.commentaires ?? r.comments ?? r.nbre_commentaires ?? 0;
    return Number(reactions) + Number(comments);
  }

  function getFilteredVideos() {
    const q = state.search.trim();
    let result = state.videos;
    state.contentMatchSet = new Set();

    if (state.videoYear !== 'all') {
      result = result.filter(r => getVideoYear(r) === String(state.videoYear));
    }
    if (q) {
      const nq = normalizeArabic(q);
      result = result.filter(r => {
        const hay = normalizeArabic([r.titre, r.description, r.theme_fr, r.theme_ar, r.fbid].filter(Boolean).join(' '));
        return hay.includes(nq);
      });
    }
    result = [...result];
    if (state.videoSort === 'views') result.sort((a,b) => (b.vues ?? b.nbre_vue ?? 0) - (a.vues ?? a.nbre_vue ?? 0));
    else if (state.videoSort === 'reactions') result.sort((a,b) => getVideoScore(b) - getVideoScore(a));
    else result.sort((a,b) => String(b.date_iso || '').localeCompare(String(a.date_iso || '')));
    return result;
  }

  function renderVideos() {
    const items = getFilteredVideos();
    $('reelsGrid').classList.add('hidden');
    $('themesView').classList.add('hidden');
    $('treeView').classList.add('hidden');
    $('pagination').classList.add('hidden');
    $('backNavigation').classList.add('hidden');
    $('emptyState').classList.add('hidden');

    if (items.length === 0) { $('emptyState').classList.remove('hidden'); return; }

    if (state.videoView === 'themes') renderThemes(items);
    else if (state.videoView === 'tree') renderTree(items);
    else renderVideoGallery(items);
  }

  function renderVideoGallery(items) {
    $('reelsGrid').classList.remove('hidden');
    $('pagination').classList.remove('hidden');
    const totalPages = Math.max(1, Math.ceil(items.length / PAGE_SIZE_VIDEOS));
    if (state.videoPage > totalPages) state.videoPage = totalPages;
    const start = (state.videoPage - 1) * PAGE_SIZE_VIDEOS;
    const pageItems = items.slice(start, start + PAGE_SIZE_VIDEOS);
    $('reelsGrid').innerHTML = pageItems.map(videoCardHTML).join('');
    renderPagination(totalPages);
  }

  function videoCardHTML(r) {

  function renderPagination(totalPages) {
    const pag = $('pagination');
    if (totalPages <= 1) { pag.innerHTML = ''; return; }
    const page = state.videoPage;
    const base = 'min-w-[2.5rem] h-10 px-3 rounded-lg font-semibold text-sm inline-flex items-center justify-center';
    const active = 'bg-blue-600 text-white shadow-lg';
    const inactive = 'bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700';
    const disabled = 'bg-slate-800 text-slate-600 border border-slate-700 cursor-not-allowed';
    function getPages(cur, tot) {
      if (tot <= 7) return Array.from({length: tot}, (_, i) => i + 1);
      if (cur <= 4) return [1,2,3,4,5,'…',tot];
      if (cur >= tot - 3) return [1,'…',tot-4,tot-3,tot-2,tot-1,tot];
      return [1,'…',cur-1,cur,cur+1,'…',tot];
    }
    let html = `<button data-page="${page-1}" class="${base} ${page===1?disabled:inactive}" ${page===1?'disabled':''}><i class="fa-solid fa-chevron-right text-xs"></i></button>`;
    getPages(page, totalPages).forEach(p => {
      if (p === '…') html += `<span class="${base} ${inactive} select-none">…</span>`;
      else html += `<button data-page="${p}" class="${base} ${p===page?active:inactive}">${p}</button>`;
    });
    html += `<button data-page="${page+1}" class="${base} ${page===totalPages?disabled:inactive}" ${page===totalPages?'disabled':''}><i class="fa-solid fa-chevron-left text-xs"></i></button>`;
    pag.innerHTML = html;
  }

  /* ============================================================
     VALIDATION ASYNCHRONE DES IMAGES
     ============================================================ */
  function probeImage(url, timeoutMs = 8000) {
    return new Promise((resolve) => {
      if (!url) { resolve(false); return; }
      const img = new Image();
      let resolved = false;
      const done = (ok) => {
        if (resolved) return;
        resolved = true;
        img.onload = null;
        img.onerror = null;
        resolve(ok);
      };
      const timer = setTimeout(() => done(false), timeoutMs);
      img.onload = () => {
        clearTimeout(timer);
        done(img.naturalWidth > 0 && img.naturalHeight > 0);
      };
      img.onerror = () => {
        clearTimeout(timer);
        done(false);
      };
      img.src = url;
    });
  }

  async function validateImagesBatch(urls, onProgress, concurrency = 6) {
    const validSet = new Set();
    if (!urls.length) return validSet;
    let done = 0;
    let cursor = 0;
    const total = urls.length;

    async function worker() {
      while (true) {
        const i = cursor++;
        if (i >= total) return;
        const ok = await probeImage(urls[i]);
        if (ok) validSet.add(urls[i]);
        done++;
        if (onProgress) {
          try { onProgress(done, total); } catch (_) { /* ignore */ }
        }
      }
    }

    const workers = Array.from({ length: Math.min(concurrency, total) }, () => worker());
    await Promise.all(workers);
    return validSet;
  }

  async function initArchive() {
    if (state.archiveInitialized) return;
    state.archiveInitialized = true;

    const uniqueUrls = new Set();
    ARCHIVE_RAW.forEach(item => item.images.forEach(u => uniqueUrls.add(u)));
    const urlList = Array.from(uniqueUrls);

    const overlay = $('progressOverlay');
    const bar = $('progressBar');
    const pctEl = $('progressPercent');
    const countEl = $('progressCount');
    if (overlay) {
      overlay.classList.remove('hidden');
      if (bar) bar.style.width = '0%';
      if (pctEl) pctEl.textContent = '0%';
      if (countEl) countEl.textContent = `0 / ${urlList.length}`;
    }

    let validSet = new Set();
    try {
      validSet = await validateImagesBatch(urlList, (done, total) => {
        const pct = total ? Math.round((done / total) * 100) : 100;
        if (bar) bar.style.width = pct + '%';
        if (pctEl) pctEl.textContent = pct + '%';
        if (countEl) countEl.textContent = `${done} / ${total}`;
      }, 6);
    } catch (e) {
      console.error('Erreur validation images:', e);
    } finally {
      if (overlay) overlay.classList.add('hidden');
    }

    const filtered = [];
    ARCHIVE_RAW.forEach(item => {
      const validImages = item.images.filter(u => validSet.has(u));
      if (validImages.length > 0) {
        filtered.push({ ...item, images: validImages, type: 'PHOTO' });
      }
    });
    ARCHIVE_DATA = filtered;

    ALL_PHOTOS = [];
    ARCHIVE_DATA.forEach(item => {
      item.images.forEach((src, i) => {
        ALL_PHOTOS.push({
          src,
          date: item.date,
          caption: item.text,
          reactions: item.reactions,
          partages: item.partages,
          fbUrl: item.url_canonique,
          fbid: item.fbid,
          index: i,
          total: item.images.length
        });
      });
    });

    const totalRefs = ARCHIVE_RAW.reduce((s, i) => s + i.images.length, 0);
    const validRefs = ARCHIVE_DATA.reduce((s, i) => s + i.images.length, 0);
    console.group('%c📊 Bilan de vérification des images', 'color:#c59b45;font-weight:bold');
    console.log(`Publications analysées : ${ARCHIVE_RAW.length}`);
    console.log(`Publications conservées : ${ARCHIVE_DATA.length}`);
    console.log(`Publications exclues : ${ARCHIVE_RAW.length - ARCHIVE_DATA.length}`);
    console.log(`Images uniques vérifiées : ${urlList.length}`);
    console.log(`Images uniques valides : ${validSet.size}`);
    console.log(`Images uniques invalides : ${urlList.length - validSet.size}`);
    console.log(`Références d'images totales : ${totalRefs}`);
    console.log(`Références d'images valides : ${validRefs}`);
    console.groupEnd();
  }

  function openLightbox(list, index) {
    if (!list || !list.length) return;
    state.lb.list = list.slice();
    state.lb.index = Math.max(0, Math.min(index, list.length - 1));
    updateLightboxUI();
    $('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function updateLightboxUI() {
    const s = state.lb.list[state.lb.index];
    if (!s) { closeLightbox(); return; }
    const img = $('lbImg');
    img.onerror = () => {
      state.lb.list.splice(state.lb.index, 1);
      if (state.lb.list.length === 0) { closeLightbox(); return; }
      if (state.lb.index >= state.lb.list.length) state.lb.index = 0;
      updateLightboxUI();
    };
    img.src = s.src;
    $('lbDate').textContent = s.date;
    $('lbCounter').textContent = `${state.lb.index + 1} / ${state.lb.list.length}`;
    $('lbCaption').textContent = s.caption;
    $('lbReactions').textContent = s.reactions ?? 0;
    $('lbShares').textContent = s.partages ?? 0;
    $('lbFbLink').href = s.fbUrl;
    const show = state.lb.list.length > 1;
    $('lbPrev').style.display = show ? 'flex' : 'none';
    $('lbNext').style.display = show ? 'flex' : 'none';
  }

  function closeLightbox() {
    $('lightbox').classList.remove('open');
    document.body.style.overflow = '';
    const img = $('lbImg');
    if (img) img.onerror = null;
  }

  /* ============================================================
     DÉLÉGATION ERREURS IMAGES
     ============================================================ */
  document.addEventListener('error', (e) => {
    const img = e.target;
    if (!(img instanceof HTMLImageElement)) return;
    if (img.closest('.thumb-wrap')) return;
    if (img.id === 'lbImg') return;

    const tile = img.closest('.photo-tile');
    if (tile) {
      const grid = tile.parentElement;
      tile.remove();
      if (grid && grid.id === 'photosGrid' && !grid.querySelector('.photo-tile')) {
        $('photosEmpty').classList.remove('hidden');
      }
      return;
    }

    if (img.closest('.pub-thumbs')) { img.remove(); return; }

    const media = img.closest('.pub-media');
    if (media) {
      const card = media.closest('.pub-card');
      const thumbs = card ? card.querySelectorAll('.pub-thumbs img') : [];
      let swapped = false;
      for (const t of thumbs) {
        if (t !== img && t.complete && t.naturalWidth > 0) {
          img.src = t.src;
          swapped = true;
          break;
        }
      }
      if (!swapped) {
        media.remove();
        if (card && !card.querySelector('.pub-media') && !card.querySelector('.pub-thumbs img')) {
          card.remove();
        }
      }
    }
  }, true);

  /**
   * Positionne un .menu-dropdown-content (position: fixed) sous son trigger.
   * Le containing block est .app-header (backdrop-filter), donc on calcule
   * des coordonnées relatives à ce conteneur, pas au viewport.
   */
  function positionDropdown(btn, content) {
    if (!btn || !content) return;
    const rect = btn.getBoundingClientRect();
    const header = btn.closest('.app-header');
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const ddW = content.offsetWidth || 230;
    const ddH = content.offsetHeight || 100;

    let top, right;
    if (header) {
      const hRect = header.getBoundingClientRect();
      top = rect.bottom - hRect.top + 4;
      right = hRect.right - rect.right;
    } else {
      top = rect.bottom + 4;
      right = vw - rect.right;
    }

    // Empêcher le débordement à gauche
    if (vw - right - ddW < 8) right = Math.max(8, vw - ddW - 8);
    // Empêcher le débordement en bas (ouvrir au-dessus si nécessaire)
    const bottomLimit = header ? (header.getBoundingClientRect().height) : vh;
    if (top + ddH > vh - 8 && rect.top - ddH - 4 > 8) {
      top = (header ? (rect.top - header.getBoundingClientRect().top) : rect.top) - ddH - 4;
    }

    content.style.top = top + 'px';
    content.style.right = right + 'px';
    content.style.left = 'auto';
    void bottomLimit; // silence unused
  }

  // Ouverture des dropdowns
  document.querySelectorAll('.menu-dropdown').forEach(dd => {
    const btn = dd.querySelector('.menu-item');
    if (!btn) return;
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const content = dd.querySelector('.menu-dropdown-content');
      const isOpen = content && !content.classList.contains('hidden');
      closeAllDropdowns();
      if (!isOpen && content) {
        content.classList.remove('hidden');
        positionDropdown(btn, content);
        btn.setAttribute('aria-expanded', 'true');
      }
    });
  });

  // Fermer en cliquant à l'extérieur
  document.addEventListener('click', e => {
    if (!e.target.closest('.menu-dropdown')) closeAllDropdowns();
  });

  // Fermer sur scroll / resize (position: fixed ne suit pas le scroll horizontal du header-row)
  window.addEventListener('scroll', closeAllDropdowns, { capture: true, passive: true });
  window.addEventListener('resize', closeAllDropdowns);

  /* ============================================================
     ÉVÉNEMENTS : TABS
     ============================================================ */
  document.querySelectorAll('.center-tab').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  /* ============================================================
     ÉVÉNEMENTS : RECHERCHE
     ============================================================ */
  let searchTimer = null;
  $('globalSearch').addEventListener('input', e => {
    clearTimeout(searchTimer);
    const v = e.target.value;
    searchTimer = setTimeout(() => {
      state.search = v;
      state.videoPage = 1;
      state.archivePage = 1;
      renderActiveTab();
    }, 200);
  });

  /* ============================================================
     ÉVÉNEMENTS : MENU VIDÉOS
     ============================================================ */
  $('menuHome').addEventListener('click', () => {
    state.videoView = 'gallery';
    state.activeTheme = null;
    state.videoPage = 1;
    syncVideoMenus();
    renderVideos();
  });

  $('galleryDropdown').addEventListener('click', e => {
    const b = e.target.closest('[data-view]');
    if (!b) return;
    state.videoView = b.dataset.view;
    state.activeTheme = null;
    state.videoPage = 1;
    syncVideoMenus();
    renderVideos();
    closeAllDropdowns();
  });

  $('sortDropdown').addEventListener('click', e => {
    const b = e.target.closest('[data-sort]');
    if (!b) return;
    state.videoSort = b.dataset.sort;
    state.videoPage = 1;
    syncVideoMenus();
    renderVideos();
    closeAllDropdowns();
  });

  // Année (dans le header)
  $('yearDropdownContent').addEventListener('click', e => {
    const b = e.target.closest('[data-year]');
    if (!b) return;
    state.videoYear = b.dataset.year;
    state.videoPage = 1;
    syncVideoMenus();
    if (state.tab === 'videos') renderVideos();
    closeAllDropdowns();
  });

  $('backToThemesBtn').addEventListener('click', () => {
    state.activeTheme = null;
    state.videoPage = 1;
    renderVideos();
  });

  $('reelsGrid').addEventListener('click', e => {
    const card = e.target.closest('[data-fbid]');
    if (!card) return;
    const reel = state.videos.find(r => String(r.fbid) === card.dataset.fbid);
    if (reel) openVideoDetails(reel);
  });
  $('themesView').addEventListener('click', e => {
    const c = e.target.closest('[data-theme]');
    if (!c) return;
    state.activeTheme = c.dataset.theme;
    state.videoPage = 1;
    renderVideos();
  });
  $('treeContent').addEventListener('click', e => {
    const toggle = e.target.closest('.tree-toggle-btn');
    if (toggle) {
      const icon = toggle.querySelector('.tree-toggle');
      const children = toggle.nextElementSibling;
      if (children && children.classList.contains('tree-children')) {
        children.classList.toggle('hidden');
        if (icon) icon.classList.toggle('open');
      }
      return;
    }
    const node = e.target.closest('[data-fbid]');
    if (node) {
      const reel = state.videos.find(r => String(r.fbid) === node.dataset.fbid);
      if (reel) openVideoDetails(reel);
    }
  });

  $('pagination').addEventListener('click', e => {
    const b = e.target.closest('button[data-page]');
    if (!b || b.disabled) return;
    const p = parseInt(b.dataset.page, 10);
    if (!p || p === state.videoPage) return;
    state.videoPage = p;
    renderVideos();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  $('exportExcelBtn').addEventListener('click', exportToExcel);

  // syncVideoMenus : mutex uniquement pour home/gallery/sort.
  // L'année est indépendante (dans le header) et reflète juste l'état.
  function syncVideoMenus() {
    const badge = $('yearBadge');
    if (badge) badge.textContent = state.videoYear === 'all' ? 'الكل' : toArabicNumerals(state.videoYear);

    ['menuHome', 'menuGalerie', 'menuSort'].forEach(id => {
      const el = $(id); if (el) el.classList.remove('active');
    });
    if (state.videoView !== 'gallery') $('menuGalerie').classList.add('active');
    else if (state.videoSort !== 'recent') $('menuSort').classList.add('active');
    else $('menuHome').classList.add('active');

    $('galleryDropdown').querySelectorAll('[data-view]').forEach(b => {
      b.classList.toggle('active', b.dataset.view === state.videoView);
    });
    $('sortDropdown').querySelectorAll('[data-sort]').forEach(b => {
      b.classList.toggle('active', b.dataset.sort === state.videoSort);
    });
    $('yearDropdownContent').querySelectorAll('[data-year]').forEach(b => {
      b.classList.toggle('active', String(b.dataset.year) === String(state.videoYear));
    });
  }

  function buildYearDropdown() {
    const years = new Set();
    state.videos.forEach(r => { const y = getVideoYear(r); if (y) years.add(y); });
    const sorted = Array.from(years).sort((a,b) => Number(b) - Number(a));
    let html = `<button class="menu-dropdown-item" data-year="all"><i class="fa-solid fa-layer-group"></i><span>كل السنوات</span><i class="fa-solid fa-check dd-check"></i></button>`;
    if (sorted.length) {
      html += '<div class="border-t border-white/10 my-1"></div>';
      sorted.forEach(y => {
        html += `<button class="menu-dropdown-item" data-year="${escapeHtml(y)}"><i class="fa-solid fa-calendar-day"></i><span>${escapeHtml(toArabicNumerals(y))}</span><i class="fa-solid fa-check dd-check"></i></button>`;
      });
    }
    $('yearDropdownContent').innerHTML = html;
  }

  function initVideoYear() {
    const years = new Set();
    state.videos.forEach(r => { const y = getVideoYear(r); if (y) years.add(y); });
    const sorted = Array.from(years).sort((a,b) => Number(b) - Number(a));
    state.videoYear = sorted.includes('2026') ? '2026' : (sorted[0] || 'all');
  }

  /* ============================================================
     VIDÉO : DÉTAILS
     ============================================================ */
  let currentVideo = null;
  let posterFadeTimer = null;
  let iframeReady = false;

  function openVideoDetails(reel) {
    currentVideo = reel;
    iframeReady = false;
    const content = $('detailsContent');
    content.innerHTML = renderVideoDetails(reel);
    content.scrollTop = 0;
    $('detailsDisplayTitle').textContent = reel.titre || 'العنوان غير متوفر';
    $('detailsDisplayDate').textContent = formatDateArabic(reel.date, reel.date_iso);
    $('playerViewsVal').textContent = formatNumber(reel.vues ?? reel.nbre_vue ?? 0);
    $('playerReactionsVal').textContent = reel.reactions ?? 0;
    const img = $('detailsPosterImg');
    img.parentElement.classList.remove('thumb-error');
    img.src = reel.miniature || DEFAULT_IMG;
    $('detailsPoster').classList.remove('opacity-0', 'pointer-events-none');
    $('detailsPoster').classList.add('opacity-100');
    $('detailsFrame').classList.remove('opacity-100');
    $('detailsFrame').classList.add('opacity-0');
    $('videoLoader').classList.remove('hidden');
    $('detailsModal').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    const shareUrl = reel.url_canonique || reel.url;
    const src = `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(shareUrl)}&show_text=false&width=500&height=889&autoplay=true&mute=false&allowfullscreen=true`;
    $('detailsFrame').src = src;
    clearTimeout(posterFadeTimer);
    posterFadeTimer = setTimeout(revealPlayer, 15000);
  }

  function revealPlayer() {
    clearTimeout(posterFadeTimer);
    $('videoLoader').classList.add('hidden');
    $('detailsPoster').classList.add('opacity-0', 'pointer-events-none');
    $('detailsPoster').classList.remove('opacity-100');
    $('detailsFrame').classList.remove('opacity-0');
    $('detailsFrame').classList.add('opacity-100');
  }

  function closeVideoDetails() {
    clearTimeout(posterFadeTimer);
    iframeReady = false;
    $('detailsModal').classList.add('hidden');
    $('detailsFrame').src = 'about:blank';
    $('detailsContent').innerHTML = '';
    $('detailsPosterImg').removeAttribute('src');
    $('videoLoader').classList.add('hidden');
    document.body.style.overflow = '';
    currentVideo = null;
  }

  function renderVideoDetails(reel) {
    const themeAr = reel.theme_ar || null;
    const themeFr = reel.theme_fr || null;
    const description = reel.description || null;
    const statHTML = (label, value, icon, color) => `
      <div class="bg-slate-900/80 border border-slate-700/80 rounded-xl p-3">
        <div class="flex items-center gap-1.5 text-xs text-slate-400 mb-1"><i class="fa-solid ${icon} ${color}"></i><span>${label}</span></div>
        <div class="text-base font-bold ${color} truncate">${escapeHtml(String(value))}</div>
      </div>`;
    return `
      ${(themeAr || themeFr) ? `<div class="flex flex-wrap gap-2">
        ${themeAr ? `<span class="theme-chip" dir="rtl"><i class="fa-solid fa-tag text-[9px]"></i> ${escapeHtml(themeAr)}</span>` : ''}
        ${themeFr && themeFr !== themeAr ? `<span class="inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1 rounded-full bg-blue-500/15 text-blue-300 border border-blue-500/30" dir="ltr"><i class="fa-solid fa-tag text-[10px]"></i>${escapeHtml(themeFr)}</span>` : ''}
      </div>` : ''}
      <h2 class="text-base sm:text-lg font-bold text-white leading-relaxed" dir="auto">${reel.titre ? escapeHtml(reel.titre) : 'مقطع فيديو'}</h2>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
        ${statHTML('المشاهدات', formatNumber(reel.vues ?? reel.nbre_vue ?? 0), 'fa-eye', 'text-amber-400')}
        ${statHTML('التفاعلات', reel.reactions ?? '—', 'fa-heart', 'text-rose-400')}
        ${statHTML('التاريخ', formatDateArabic(reel.date, reel.date_iso) || '—', 'fa-calendar', 'text-slate-400')}
      </div>
      ${description ? `<div><div class="text-xs font-semibold text-slate-400 uppercase mb-2">الوصف</div><p class="text-sm text-slate-300 leading-relaxed whitespace-pre-line bg-slate-900/40 p-3 rounded-lg border border-slate-700/50" dir="auto">${escapeHtml(description)}</p></div>` : ''}
      <div class="flex flex-col sm:flex-row gap-2 pt-2">
        ${reel.url ? `<a href="${escapeHtml(reel.url)}" target="_blank" rel="noopener" class="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl" dir="ltr"><i class="fa-brands fa-facebook"></i> Voir sur Facebook</a>` : ''}
      </div>`;
  }

  $('detailsModal').addEventListener('click', e => {
    if (e.target.closest('[data-close-details]')) closeVideoDetails();
  });
  $('detailsPlayBtn').addEventListener('click', () => {
    if (!currentVideo) return;
    if (iframeReady) revealPlayer();
  });
  $('detailsFrame').addEventListener('load', () => {
    if ($('detailsModal').classList.contains('hidden')) return;
    if (!$('detailsFrame').src || $('detailsFrame').src === 'about:blank') return;
    iframeReady = true;
    $('videoLoader').classList.add('hidden');
    clearTimeout(posterFadeTimer);
    posterFadeTimer = setTimeout(revealPlayer, 500);
  });
  $('fullscreenBtn').addEventListener('click', async () => {
    const el = $('playerZone');
    try {
      const isFs = document.fullscreenElement || document.webkitFullscreenElement;
      if (!isFs) {
        if (el.requestFullscreen) await el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) await document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    } catch (e) { console.warn(e); }
  });

  /* ============================================================
     EXCEL EXPORT
     ============================================================ */
  function exportToExcel() {
    if (typeof XLSX === 'undefined') { alert('SheetJS non chargé'); return; }
    const items = getFilteredVideos();
    if (!items.length) { alert('لا توجد بيانات'); return; }
    const map = new Map();
    items.forEach(r => {
      const fr = r.theme_fr || 'Non classé';
      const ar = r.theme_ar || fr;
      if (!map.has(fr)) map.set(fr, { ar, fr, videos: [] });
      map.get(fr).videos.push(r);
    });
    const wb = XLSX.utils.book_new();
    const used = new Set();
    const entries = Array.from(map.values()).sort((a,b) => b.videos.length - a.videos.length);
    entries.forEach(meta => {
      let base = String(meta.ar || meta.fr).replace(/[\\\/\?\*\[\]:]/g, '_').substring(0, 31) || 'Sans';
      let name = base, i = 2;
      while (used.has(name.toLowerCase())) { name = base.substring(0, 28) + '_' + i; i++; }
      used.add(name.toLowerCase());
      const rows = [['العنوان', 'الوصف', 'FBID']];
      meta.videos.forEach(v => rows.push([v.titre || '', v.description || '', String(v.fbid || '')]));
      const ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = [{wch:60},{wch:90},{wch:22}];
      XLSX.utils.book_append_sheet(wb, ws, name);
    });
    const summary = [['الموضوع (FR)', 'الموضوع (AR)', 'العدد']];
    entries.forEach(m => summary.push([m.fr, m.ar, m.videos.length]));
    summary.push(['المجموع', '', items.length]);
    const wsSum = XLSX.utils.aoa_to_sheet(summary);
    wsSum['!cols'] = [{wch:40},{wch:40},{wch:18}];
    XLSX.utils.book_append_sheet(wb, wsSum, '_ملخص');
    XLSX.writeFile(wb, `Galerie_Videos_${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  /* ============================================================
     LIGHTBOX EVENTS
     ============================================================ */
  $('lbClose').addEventListener('click', closeLightbox);
  $('lightbox').addEventListener('click', e => {
    if (e.target.id === 'lightbox') closeLightbox();
  });
  $('lbPrev').addEventListener('click', () => {
    state.lb.index = (state.lb.index - 1 + state.lb.list.length) % state.lb.list.length;
    updateLightboxUI();
  });
  $('lbNext').addEventListener('click', () => {
    state.lb.index = (state.lb.index + 1) % state.lb.list.length;
    updateLightboxUI();
  });

  $('photosGrid').addEventListener('click', e => {
    const tile = e.target.closest('.photo-tile');
    if (!tile) return;
    const list = $('photosGrid')._activeList || [];
    const idx = parseInt(tile.dataset.photoIdx, 10);
    if (list.length) openLightbox(list, idx);
  });

  $('pubGrid').addEventListener('click', e => {
    const readMore = e.target.closest('.read-more');
    if (readMore) {
      const p = $(readMore.dataset.target);
      if (p) {
        const expanded = p.classList.toggle('expanded');
        readMore.textContent = expanded ? 'طي النص' : 'قراءة المزيد...';
      }
      return;
    }
    const lbTrigger = e.target.closest('[data-open-lightbox]');
    if (lbTrigger) {
      const fbid = lbTrigger.dataset.openLightbox;
      const item = ARCHIVE_DATA.find(i => i.fbid === fbid);
      if (item && item.images.length) {
        const slides = item.images.map(src => ({
          src, date: item.date, caption: item.text,
          reactions: item.reactions, partages: item.partages, fbUrl: item.url_canonique
        }));
        openLightbox(slides, 0);
      }
      return;
    }
    const thumb = e.target.closest('.pub-thumbs img');
    if (thumb) {
      const card = thumb.closest('.pub-card');
      const main = card.querySelector('.pub-media img');
      const idx = parseInt(thumb.dataset.idx, 10);
      const fbid = card.dataset.fbid;
      const item = ARCHIVE_DATA.find(i => i.fbid === fbid);
      if (main && item && item.images[idx]) {
        main.src = item.images[idx];
        card.querySelectorAll('.pub-thumbs img').forEach(t => t.classList.remove('active'));
        thumb.classList.add('active');
      }
    }
  });

  /* ============================================================
     REMARKS / EXIT / ÉCHAP
     ============================================================ */
  function showEmailStatus(type, text) {
    const el = $('emailRemarkStatus');
    if (!el) return;
    el.classList.remove('hidden');
    el.className = 'rounded-lg px-3 py-2 text-sm ' + (
      type === 'success' ? 'bg-emerald-500/15 text-emerald-300 border border-emerald-500/30' :
      type === 'error' ? 'bg-rose-500/15 text-rose-300 border border-rose-500/30' :
      'bg-slate-700/50 text-slate-300 border border-slate-600'
    );
    el.textContent = text;
  }
  $('openRemarksBtn').addEventListener('click', () => {
    $('remarksModal').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    $('emailRemarkStatus').classList.add('hidden');
    $('emailRemarkBtn').disabled = false;
    setTimeout(() => $('emailRemarkText').focus(), 80);
  });
  function closeRemarks() {
    $('remarksModal').classList.add('hidden');
    document.body.style.overflow = '';
    $('emailRemarkStatus').classList.add('hidden');
    $('emailRemarkBtn').disabled = false;
  }
  $('remarksModal').addEventListener('click', e => {
    if (e.target.closest('[data-close-remarks]')) closeRemarks();
  });
  $('emailRemarkForm').addEventListener('submit', e => {
    e.preventDefault();
    const btn = $('emailRemarkBtn');
    if (btn.disabled) return;
    const text = $('emailRemarkText').value.trim();
    if (!text) { showEmailStatus('error', 'الرجاء كتابة ملاحظتك'); return; }
    btn.disabled = true;
    showEmailStatus('pending', 'جارٍ الإرسال…');
    fetch(EMAIL_REMARK_SCRIPT_URL, { method: 'POST', body: new FormData(e.target), redirect: 'follow' })
      .then(r => {
        if (!r.ok) throw new Error('Fail');
        showEmailStatus('success', 'تم الإرسال بنجاح');
        e.target.reset();
        setTimeout(closeRemarks, 1500);
      })
      .catch(() => showEmailStatus('error', 'حدث خطأ'))
      .finally(() => { btn.disabled = false; });
  });

  let exitTrapActive = false, allowExit = false, exitDialogOpen = false;
  function activateExitTrap() {
    if (exitTrapActive) return;
    exitTrapActive = true;
    try { history.pushState({ g: true }, '', location.href); } catch (e) {}
  }
  function showExitDialog() {
    if (exitDialogOpen) return;
    exitDialogOpen = true;
    $('exitConfirmModal').classList.remove('hidden');
  }
  function hideExitDialog() {
    $('exitConfirmModal').classList.add('hidden');
    exitDialogOpen = false;
  }
  function performConfirmedExit() {
    allowExit = true;
    hideExitDialog();
    if (history.length >= 3) history.go(-2);
    else if (history.length >= 2) history.back();
    else window.close();
  }
  window.addEventListener('beforeunload', e => {
    if (allowExit || !exitTrapActive) return;
    e.preventDefault();
    e.returnValue = 'مغادرة المعرض؟';
    return e.returnValue;
  });
  window.addEventListener('popstate', () => {
    if (allowExit || !exitTrapActive) return;
    try { history.pushState({ g: true }, '', location.href); } catch (e) {}
    if (!exitDialogOpen) showExitDialog();
  });
  window.addEventListener('click', activateExitTrap, { once: true, capture: true });
  $('exitConfirmModal').addEventListener('click', e => {
    if (e.target.closest('[data-exit-cancel]')) { hideExitDialog(); return; }
    if (e.target.closest('[data-exit-confirm]')) { performConfirmedExit(); return; }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      const openDD = document.querySelector('.menu-dropdown-content:not(.hidden)');
      if (openDD) { closeAllDropdowns(); return; }
      if ($('lightbox').classList.contains('open')) { closeLightbox(); return; }
      if (!$('detailsModal').classList.contains('hidden')) { closeVideoDetails(); return; }
      if (!$('remarksModal').classList.contains('hidden')) { closeRemarks(); return; }
      if (exitDialogOpen) { hideExitDialog(); return; }
    }
    if ($('lightbox').classList.contains('open')) {
      if (e.key === 'ArrowRight') $('lbPrev').click();
      if (e.key === 'ArrowLeft') $('lbNext').click();
    }
  });

  /* ============================================================
     BOOT
     ============================================================ */
  async function boot(videoData) {
    state.videos = Array.isArray(videoData) ? videoData : [];
    buildYearDropdown();
    initVideoYear();
    syncVideoMenus();

    try { await initArchive(); }
    catch (e) { console.error('Erreur initArchive:', e); }

    updateTabCounts();
    renderVideos();
  }

  if (Array.isArray(window.reelsData) && window.reelsData.length > 0) {
    boot(window.reelsData);
  } else {
    window.addEventListener('videotheque:data-ready', () => boot(window.reelsData || []), { once: true });
  }

})();
</script>

<!-- ============ CHARGEMENT DONNÉES EXTERNES ============ -->
<script>
window.reelsData = [];
window.tabeleau_url_content = [];

const REELS_DATA_URL = "https://marocnetmail.github.io/125/json/reelsData.json";
const URL_CONTENT_URL = "https://marocnetmail.github.io/125/json/url_content.json";

window.videothequeDataReady = Promise.all([
  fetch(REELS_DATA_URL, { cache: "no-store" }).then(r => {
    if (!r.ok) throw new Error('Failed reelsData');
    return r.json();
  }),
  fetch(URL_CONTENT_URL, { cache: "no-store" }).then(r => {
    if (!r.ok) throw new Error('Failed url_content');
    return r.json();
  })
]).then(([reels, content]) => {
  window.reelsData = Array.isArray(reels) ? reels : [];
  window.tabeleau_url_content = Array.isArray(content) ? content : [];
  console.log("✅ Vidéothèque chargée:", window.reelsData.length, "vidéos");
  return { reelsData: window.reelsData, tabeleau_url_content: window.tabeleau_url_content };
}).catch(err => {
  console.error("❌ Erreur chargement:", err);
  return { reelsData: window.reelsData, tabeleau_url_content: window.tabeleau_url_content };
}).finally(() => {
  window.dispatchEvent(new Event("videotheque:data-ready"));
});
</script>
